
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10111a">
<title>Rizik AI</title>

<style>
*{box-sizing:border-box}
:root{font-family:system-ui,-apple-system,sans-serif;color:#f5f5fa;background:#10111a}
body{margin:0;min-height:100vh;background:#10111a}
header{padding:18px 16px;background:#171925;border-bottom:1px solid #292c3b;display:flex;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:22px}
header small{color:#9da2b8}
main{max-width:850px;margin:auto;padding:14px}
#status{font-size:13px;color:#aeb4ca;margin:5px 0 12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button{border:0;border-radius:12px;padding:11px 14px;background:#292d40;color:white;font-size:14px;cursor:pointer}
button:disabled{opacity:.5}
.primary{background:#7259e8}
#chat{display:flex;flex-direction:column;gap:12px;min-height:45vh;padding-bottom:12px}
.message{padding:13px 15px;border-radius:16px;max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.user{background:#624bd1;align-self:flex-end}
.assistant{background:#202333;align-self:flex-start}
.system{background:#292d40;color:#c4c9db;align-self:center;font-size:13px}
.composer{position:sticky;bottom:0;background:#10111a;padding:10px 0 calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
textarea{flex:1;resize:none;min-height:48px;max-height:130px;border-radius:14px;border:1px solid #383c50;background:#1b1e2b;color:white;padding:13px;font:inherit;outline:none}
#send{background:#7259e8;font-weight:bold;min-width:64px}
#modelFile{display:none}
.info{font-size:12px;color:#9299b0;margin-top:10px}
a{color:#a99aff}
</style>
</head>

<body>
<header>
  <div>
    <h1>✨ Rizik AI</h1>
    <small>Seu assistente pessoal</small>
  </div>
  <button id="clear">Limpar</button>
</header>

<main>
  <div id="status">Preparando o assistente...</div>

  <div class="toolbar">
    <button id="loadModel" class="primary">Carregar IA</button>
    <button id="searchBtn">🌐 Pesquisar</button>
    <button id="weatherBtn">🌤️ Clima</button>
    <button id="voiceBtn">🎙️ Falar</button>
    <button id="stopVoice">🔇 Parar voz</button>
    <button id="shareBtn">Compartilhar</button>
    <button id="chooseModel">📁 Escolher modelo</button>
    <input id="modelFile" type="file" accept=".gguf">
  </div>

  <div id="chat"></div>

  <div class="composer">
    <textarea id="prompt" placeholder="Converse com o Rizik..." rows="1"></textarea>
    <button id="send">Enviar</button>
  </div>

  <div class="info">
    A IA é executada localmente no dispositivo. A pesquisa e o clima precisam de internet.
  </div>
</main>

<script type="module">
import { Wllama } from "https://cdn.jsdelivr.net/npm/@wllama/wllama@3.0.0/esm/index.js";

const REPO = "Qwen/Qwen2.5-0.5B-Instruct-GGUF";
const FILE = "qwen2.5-0.5b-instruct-q4_k_m.gguf";
const MODEL_URL = `https://huggingface.co/${REPO}/resolve/main/${FILE}`;

const $ = id => document.getElementById(id);
const chat = $("chat");
const status = $("status");
const promptBox = $("prompt");

let wllama = null;
let modelReady = false;
let busy = false;
let internetContext = "";
let history = [];

function setStatus(message) {
  status.textContent = message;
}

function addMessage(role, content) {
  const div = document.createElement("div");
  div.className = "message " + role;
  div.textContent = content;
  chat.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
  return div;
}

function saveHistory() {
  try {
    localStorage.setItem("rizik_history", JSON.stringify(history));
  } catch {}
}

function loadHistory() {
  try {
    history = JSON.parse(localStorage.getItem("rizik_history") || "[]");
    for (const item of history) {
      addMessage(item.role, item.content);
    }
  } catch {
    history = [];
  }
}

function systemPrompt() {
  return `Você é Rizik, um assistente pessoal inteligente, amigável e descontraído.
Responda sempre em português brasileiro.
Seja útil, direto e natural.
Quando receber informações de pesquisa ou clima, use essas informações para responder.
Não invente informações que não estejam disponíveis.
Se não souber algo, diga claramente.`;
}

async function loadAI() {
  if (modelReady) {
    setStatus("IA já está carregada!");
    return;
  }

  $("loadModel").disabled = true;

  try {
    setStatus("Baixando e preparando a IA... Isso pode demorar.");

    const wasmPaths = {
      "single-thread/wllama.wasm":
        "https://cdn.jsdelivr.net/npm/@wllama/wllama@3.0.0/esm/single-thread/wllama.wasm",
      "multi-thread/wllama.wasm":
        "https://cdn.jsdelivr.net/npm/@wllama/wllama@3.0.0/esm/multi-thread/wllama.wasm"
    };

    wllama = new Wllama(wasmPaths);

    await wllama.loadModelFromUrl(MODEL_URL, {
      n_ctx: 2048,
      n_threads: 3,
      progressCallback: (progress) => {
        if (progress && progress.total) {
          const percent = Math.round(progress.loaded / progress.total * 100);
          setStatus(`Baixando modelo: ${percent}%`);
        }
      }
    });

    modelReady = true;
    setStatus("Rizik está pronto! Pode conversar.");
    addMessage("system", "IA carregada com sucesso! 🚀");

  } catch (error) {
    console.error(error);
    setStatus("Não foi possível carregar a IA. Verifique sua internet e tente novamente.");
    addMessage("system", "Erro ao carregar o modelo: " + error.message);
  } finally {
    $("loadModel").disabled = false;
  }
}

async function generate(userText) {
  if (!modelReady) {
    addMessage("system", "Primeiro toque em Carregar IA.");
    return;
  }

  if (busy) return;
  busy = true;
  $("send").disabled = true;

  addMessage("user", userText);
  history.push({role:"user", content:userText});
  saveHistory();

  const answerBox = addMessage("assistant", "Pensando...");
  setStatus("Rizik está pensando...");

  try {
    let context = "";
    if (internetContext) {
      context = "\n\nInformações obtidas da internet ou do clima:\n" +
        internetContext +
        "\n\nUse essas informações para responder à pergunta do usuário.";
      internetContext = "";
    }

    const messages = [
      {role:"system", content:systemPrompt()},
      ...history.slice(-10),
      {role:"user", content:userText + context}
    ];

    const prompt = messages.map(m => {
      if (m.role === "system") return `<|im_start|>system\n${m.content}<|im_end|>`;
      if (m.role === "user") return `<|im_start|>user\n${m.content}<|im_end|>`;
      return `<|im_start|>assistant\n${m.content}<|im_end|>`;
    }).join("\n") + "\n<|im_start|>assistant\n";

    let answer = await wllama.createCompletion(prompt, {
      nPredict: 400,
      sampling: {
        temp: 0.7,
        top_p: 0.9
      }
    });

    answer = answer.trim();
    answerBox.textContent = answer || "Não consegui gerar uma resposta.";
    history.push({role:"assistant", content:answer});
    saveHistory();

  } catch (error) {
    console.error(error);
    answerBox.textContent = "Ocorreu um erro ao gerar a resposta: " + error.message;
  } finally {
    busy = false;
    $("send").disabled = false;
    setStatus(modelReady ? "Rizik está pronto." : "IA não carregada.");
  }
}

$("send").addEventListener("click", async () => {
  const text = promptBox.value.trim();
  if (!text) return;
  promptBox.value = "";
  await generate(text);
});

promptBox.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    $("send").click();
  }
});

$("loadModel").addEventListener("click", loadAI);

$("clear").addEventListener("click", () => {
  if (!confirm("Apagar toda a conversa?")) return;
  history = [];
  chat.innerHTML = "";
  saveHistory();
});

$("shareBtn").addEventListener("click", async () => {
  const text = history.map(m =>
    (m.role === "user" ? "Você: " : "Rizik: ") + m.content
  ).join("\n\n");

  if (!text) {
    addMessage("system", "Não há conversa para compartilhar.");
    return;
  }

  if (navigator.share) {
    try {
      await navigator.share({title:"Conversa com Rizik", text});
    } catch {}
  } else {
    try {
      await navigator.clipboard.writeText(text);
      addMessage("system", "Conversa copiada!");
    } catch {
      addMessage("system", "Não foi possível compartilhar.");
    }
  }
});

$("searchBtn").addEventListener("click", async () => {
  const query = prompt("O que você quer pesquisar na internet?");
  if (!query) return;

  addMessage("system", "Pesquisando na internet: " + query);
  setStatus("Buscando informações...");

  try {
    const response = await fetch(
      "https://s.jina.ai/" + encodeURIComponent(query),
      {
        headers: {
          "Accept": "application/json"
        }
      }
    );

    if (!response.ok) throw new Error("Pesquisa indisponível.");

    const data = await response.json();
    let results = "";

    if (Array.isArray(data.data)) {
      results = data.data.map(item =>
        `Título: ${item.title || ""}\n` +
        `Descrição: ${item.description || item.content || ""}\n` +
        `Link: ${item.url || ""}`
      ).join("\n\n");
    }

    if (!results) results = JSON.stringify(data).slice(0, 12000);

    internetContext = results.slice(0, 12000);
    await generate("Pesquise e explique: " + query);

  } catch (error) {
    console.error(error);
    addMessage("system", "Não consegui fazer a pesquisa. Tente novamente mais tarde.");
    setStatus("Pesquisa indisponível.");
  }
});

$("weatherBtn").addEventListener("click", async () => {
  const city = prompt("Qual cidade deseja consultar?", "Nova Esperança");
  if (!city) return;

  addMessage("system", "Consultando o clima de " + city + "...");
  setStatus("Buscando previsão do tempo...");

  try {
    const geoResponse = await fetch(
      "https://geocoding-api.open-meteo.com/v1/search?name=" +
      encodeURIComponent(city) + "&count=1&language=pt&format=json"
    );

    if (!geoResponse.ok) throw new Error("Falha ao localizar cidade.");

    const geo = await geoResponse.json();
    if (!geo.results || !geo.results.length) {
      throw new Error("Cidade não encontrada.");
    }

    const place = geo.results[0];

    const weatherResponse = await fetch(
      "https://api.open-meteo.com/v1/forecast?" +
      `latitude=${place.latitude}&longitude=${place.longitude}` +
      "&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,rain,weather_code,wind_speed_10m" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
      "&timezone=auto&forecast_days=7"
    );

    if (!weatherResponse.ok) throw new Error("Falha ao consultar previsão.");

    const weather = await weatherResponse.json();
    const current = weather.current;
    const daily = weather.daily;

    const conditions = {
      0:"Céu limpo",
      1:"Predominantemente limpo",
      2:"Parcialmente nublado",
      3:"Nublado",
      45:"Neblina",
      48:"Neblina com geada",
      51:"Garoa leve",
      53:"Garoa moderada",
      55:"Garoa forte",
      61:"Chuva leve",
      63:"Chuva moderada",
      65:"Chuva forte",
      71:"Neve leve",
      73:"Neve moderada",
      75:"Neve forte",
      80:"Pancadas de chuva leves",
      81:"Pancadas de chuva moderadas",
      82:"Pancadas de chuva fortes",
      95:"Trovoadas",
      96:"Trovoadas com granizo leve",
      99:"Trovoadas com granizo forte"
    };

    let report = `Clima de ${place.name}, ${place.admin1 || ""}, ${place.country || ""}.\n`;
    report += `Agora: ${conditions[current.weather_code] || "Condição não identificada"}.\n`;
    report += `Temperatura: ${current.temperature_2m}°C.\n`;
    report += `Sensação térmica: ${current.apparent_temperature}°C.\n`;
    report += `Umidade: ${current.relative_humidity_2m}%.\n`;
    report += `Vento: ${current.wind_speed_10m} km/h.\n`;
    report += `Precipitação atual: ${current.precipitation} mm.\n\n`;
    report += "Previsão para os próximos dias:\n";

    for (let i = 0; i < daily.time.length; i++) {
      report += `${daily.time[i]}: ` +
        `${conditions[daily.weather_code[i]] || "Condição variável"}, ` +
        `mínima ${daily.temperature_2m_min[i]}°C, ` +
        `máxima ${daily.temperature_2m_max[i]}°C, ` +
        `chance de chuva ${daily.precipitation_probability_max[i]}%.\n`;
    }

    internetContext = report;
    await generate("Me explique a previsão do tempo de " + place.name + ".");
  } catch (error) {
    console.error(error);
    addMessage("system", "Não consegui consultar o clima: " + error.message);
    setStatus("Consulta de clima indisponível.");
  }
});

let recognition = null;

$("voiceBtn").addEventListener("click", () => {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    addMessage("system", "Seu navegador não oferece reconhecimento de voz.");
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = "pt-BR";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => setStatus("Estou ouvindo...");
  recognition.onresult = e => {
    promptBox.value = e.results[0][0].transcript;
    $("send").click();
  };
  recognition.onerror = () => setStatus("Não consegui ouvir. Tente novamente.");
  recognition.onend = () => {
    if (modelReady) setStatus("Rizik está pronto.");
  };

  recognition.start();
});

$("stopVoice").addEventListener("click", () => {
  if (recognition) recognition.stop();
  speechSynthesis.cancel();
});

$("chooseModel").addEventListener("click", () => {
  $("modelFile").click();
});

$("modelFile").addEventListener("change", async e => {
  const file = e.target.files[0];
  if (!file) return;

  addMessage("system", "Arquivo selecionado: " + file.name);
  addMessage("system", "O carregamento de um modelo local personalizado precisa ser compatível com a versão do Wllama.");
});

loadHistory();

if (!history.length) {
  addMessage("assistant", "Olá! Eu sou o Rizik. 😎 Carregue minha IA para começar. Também posso pesquisar na internet e consultar o clima.");
}

setStatus("Toque em Carregar IA para começar.");
</script>
</body>
</html>
