<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10111a">
<title>Rizik AI</title>

<script>
(function () {
  // Ativa o modo rápido (vários núcleos) no GitHub Pages.
  try {
    if (self.crossOriginIsolated || !("serviceWorker" in navigator)) return;
    if (sessionStorage.getItem("rizik_coi") === "1") return;
    sessionStorage.setItem("rizik_coi", "1");
    navigator.serviceWorker.register("coi-serviceworker.js").then(function (reg) {
      reg.addEventListener("updatefound", function () { location.reload(); });
      if (reg.active && !navigator.serviceWorker.controller) location.reload();
    }).catch(function (e) { console.warn("Service worker falhou:", e); });
  } catch (e) { console.warn(e); }
})();
</script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#10111a;color:#f5f5fa;font-family:system-ui,sans-serif}
header{padding:16px;background:#191b29;display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px;margin:0}
main{max-width:850px;margin:auto;padding:14px}
#status{font-size:13px;color:#aeb4ca;margin:10px 0;overflow-wrap:anywhere}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button{border:0;border-radius:12px;padding:12px;background:#292d40;color:white;font-size:14px}
button:disabled{opacity:.5}
.primary,#send{background:#7259e8}
#send{font-weight:bold}
#chat{display:flex;flex-direction:column;gap:12px;min-height:48vh;padding-bottom:15px}
.message{padding:13px 15px;border-radius:16px;max-width:95%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.user{background:#624bd1;align-self:flex-end}
.assistant{background:#202333;align-self:flex-start}
.system{background:#292d40;color:#c4c9db;align-self:center;font-size:13px}
.composer{position:sticky;bottom:0;background:#10111a;padding:10px 0 calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
textarea{flex:1;min-width:0;resize:vertical;min-height:48px;max-height:180px;border-radius:14px;border:1px solid #383c50;background:#1b1e2b;color:white;padding:13px;font:inherit}
.sources{align-self:flex-start;max-width:95%;background:#1b1e2b;border:1px solid #383c50;border-radius:14px;padding:10px 12px;font-size:13px;color:#c4c9db;line-height:1.5}
.src-head{font-weight:bold;color:#f5f5fa}
.src-item{display:flex;gap:6px;align-items:baseline;margin-top:6px;overflow-wrap:anywhere}
.src-item a{color:#a99cff;text-decoration:none}
.src-item small{color:#9299b0;white-space:nowrap}
.copy{padding:8px 12px;font-size:13px;align-self:flex-start}
.info{font-size:12px;color:#9299b0;margin-top:12px;line-height:1.5}

html{scroll-behavior:smooth}
header{position:relative}
.hright{display:flex;align-items:center;gap:10px}
#clock{font-size:15px;color:#aeb4ca;font-variant-numeric:tabular-nums}
#menuBtn{padding:6px 14px;font-size:22px;line-height:1}
.menu{position:absolute;right:12px;top:100%;z-index:20;width:min(300px,calc(100vw - 24px));background:#1b1e2b;border:1px solid #383c50;border-radius:16px;padding:14px;box-shadow:0 12px 32px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:10px;animation:fade .18s ease}
.menu[hidden]{display:none}
.menu-title{font-weight:bold}
.menu label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#c4c9db}
.menu label.check{flex-direction:row;align-items:center;gap:8px}
.menu select,.menu input[type=text]{border-radius:10px;border:1px solid #383c50;background:#10111a;color:white;padding:9px;font:inherit}
.menu-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu-actions button{padding:10px 6px;font-size:13px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.message,.sources,.actions{animation:fade .25s ease}
.message{min-width:0}
.msg-time{display:block;margin-top:6px;font-size:11px;opacity:.6}
.notime .msg-time{display:none}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:#9299b0;animation:blink 1.2s infinite ease-in-out}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.codeblock{margin:8px 0;background:#10111a;border:1px solid #383c50;border-radius:12px;overflow:hidden}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:#191b29;font-size:12px;color:#9299b0}
.code-head button{padding:5px 10px;font-size:12px;border-radius:8px}
.codeblock pre{margin:0;padding:10px 12px;overflow-x:auto;font:12.5px/1.45 ui-monospace,Menlo,monospace;white-space:pre}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-self:flex-start}
#webToggle{padding:0 14px;font-size:20px}
#webToggle.on{background:#7259e8;box-shadow:0 0 0 2px #a99cff inset}
.hist{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.hist[hidden]{display:none}
.hist-box{background:#1b1e2b;border:1px solid #383c50;border-radius:18px 18px 0 0;width:min(850px,100%);max-height:75vh;display:flex;flex-direction:column;padding:14px 14px calc(14px + env(safe-area-inset-bottom));animation:fade .2s ease}
.hist-head{display:flex;justify-content:space-between;align-items:center;font-weight:bold;margin-bottom:8px}
.hist-head button{padding:6px 12px;font-size:13px}
.hist-list{overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.hist-item{text-align:left;background:#292d40;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.hist-item small{display:block;color:#9299b0;font-size:11px;margin-bottom:2px}
</style>
</head>

<body>
<header>
  <div>
    <h1>✨ Rizik AI</h1>

  </div>
  <div class="hright">

</div>

<main>
  <div id="status">Rizik está aguardando.</div>

  <div class="toolbar">
    <button id="load" class="primary">Carregar IA</button>
    <button id="weather">🌤️ Clima</button>
  </div>

  <div id="chat"></div>

  <div class="composer">
    <button id="webToggle" aria-pressed="false" title="Pesquisar na internet">🌐</button>
    <textarea id="prompt" placeholder="Converse com o Rizik..." rows="2"></textarea>
    <button id="send">Enviar</button>
  </div>

  <div class="info">
    Modelo local Qwen2.5 Coder 1.5B. Primeiro carregamento: aproximadamente 986 MB. Use Wi-Fi.
    A pesquisa e o clima precisam de internet.
    Configuração otimizada para reduzir o consumo de memória no iPhone.
  </div>
</main>

<script type="module">
import { Wllama } from "https://cdn.jsdelivr.net/npm/@wllama/wllama@3.13.0/esm/index.js";
import WasmFromCDN from "https://cdn.jsdelivr.net/npm/@wllama/wllama@3.13.0/esm/wasm-from-cdn.js";

const $ = id => document.getElementById(id);

const chat = $("chat");
const status = $("status");
const input = $("prompt");

const MODEL_URL =
"https://huggingface.co/bartowski/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/Qwen2.5-Coder-1.5B-Instruct-Q4_K_M.gguf";

// Para conversa geral em vez de código, troque a linha acima por:
// "https://huggingface.co/bartowski/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf"

// Limites (se o iPhone travar, reduza N_CTX para 1024).
const N_CTX = 2048;
const MAX_USER_CHARS = 1800;

const settings = Object.assign(
  { tokens: 384, temp: 0.3, city: "Nova Esperança", time: true },
  (() => {
    try { return JSON.parse(localStorage.getItem("rizik_settings") || "{}"); }
    catch (e) { return {}; }
  })()
);

function saveSettings() {
  try { localStorage.setItem("rizik_settings", JSON.stringify(settings)); }
  catch (e) { console.warn("Erro ao salvar configurações:", e); }
}

// Modelos pequenos precisam de ordens explícitas e curtas.
const SYSTEM_CHAT = `Você é Rizik AI, assistente pessoal que fala português brasileiro. Você PODE ajudar com qualquer assunto, inclusive programação. Nunca diga que não pode ajudar. Responda curto e direto. Se não souber, diga "não sei". Quando escrever código, coloque sempre dentro de um bloco de código com três crases.`;

const SYSTEM_CODE = `Você é Rizik AI, especialista em programação. Responda em português brasileiro. Você PODE ajudar com código. Diga a causa provável do problema, mostre o código corrigido em um bloco de três crases e explique como testar. Se faltar informação, peça o erro exato.`;

// Notas internas de programação. O Rizik recebe só as 2 mais parecidas
// com o pedido (o modelo é pequeno e o contexto é curto).
const KNOWLEDGE = [
  {
    keys: /criar.*ia|fazer.*ia|minha ia|assistente|wllama|modelo local|gguf/i,
    text: "Criar uma IA no navegador: 1) importe o Wllama pelo cdn.jsdelivr.net; 2) carregue um modelo GGUF pequeno (Qwen2.5 0.5B Q4_K_M, cerca de 398 MB) com loadModelFromUrl; 3) gere a resposta com createChatCompletion e stream:true; 4) publique o index.html no GitHub Pages. Vários núcleos exigem o arquivo coi-serviceworker.js."
  },
  {
    keys: /github|pages|publicar|site.*(não|nao).*atualiz|cache|commit/i,
    text: "Publicar no GitHub Pages: coloque o index.html na raiz do repositório, faça o commit, espere 1 a 2 minutos e abra o link com ?v=2 no final (troque o número a cada versão) para fugir do cache do Safari."
  },
  {
    keys: /not defined|undefined|null|cannot read|constant|const|import|syntax|erro|error|bug|console/i,
    text: "Erros comuns de JavaScript: 'X is not defined' = variável não declarada ou fora do escopo; 'Cannot read properties of null' = elemento não existe, confira o id; 'Assignment to constant variable' = troque const por let; erro de import = confira a URL e a versão da biblioteca. Leia sempre a primeira linha vermelha do console."
  },
  {
    keys: /lent|trav|demor|memória|memoria|iphone|crash|out of memory/i,
    text: "IA lenta ou travando no iPhone: use modelo pequeno (0.5B), n_ctx entre 512 e 2048, prompt curto, max_tokens baixo e vários núcleos com o coi-serviceworker.js. Prompt longo deixa a leitura lenta."
  },
  {
    keys: /fetch|api|cors|json|requisição|requisicao/i,
    text: "fetch: use await dentro de try/catch e confira response.ok antes de response.json(). Erro de CORS significa que o servidor não permite a origem: use uma API que libere CORS (origin=*)."
  },
  {
    keys: /python|indentation|modulenotfound|pip|nameerror/i,
    text: "Erros comuns de Python: IndentationError = confira os espaços do bloco; ModuleNotFoundError = instale com pip install nome; NameError = variável usada antes de ser definida."
  },
  {
    keys: /html|css|layout|celular|responsiv|botão|botao/i,
    text: "Layout no celular: use <meta name=viewport>, flex com flex-wrap, max-width:100% e unidades relativas (rem, %). Teste com a tela estreita."
  }
];

function pickTips(text) {
  const picked = KNOWLEDGE
    .filter(item => item.keys.test(text))
    .slice(0, 2)
    .map(item => item.text);

  return picked.join("\n").slice(0, 400);
}

// Só sinais fortes de código. Palavras comuns ("erro", "java", "let ")
// não ativam mais o modo programação sem querer.
function looksLikeCode(text) {
  return /```|<\/?[a-z]+[^>]*>|function\s*\(|\bconst\s+\w+\s*=|\blet\s+\w+\s*=|\bdef\s+\w+\(|console\.|Uncaught|Traceback|TypeError|ReferenceError|SyntaxError/i.test(text);
}

// Vários núcleos só funcionam com isolamento de origem cruzada
// (ativado pelo arquivo coi-serviceworker.js).
const THREADS = self.crossOriginIsolated
  ? Math.max(2, Math.min(4, navigator.hardwareConcurrency || 2))
  : 1;

let ai = null;
let ready = false;
let loadingPromise = null;
let busy = false;
let resetting = false;
let history = [];
let lastAnswer = "";

// ------------------------------
// Interface
// ------------------------------

function sayStatus(text) {
  status.textContent = text;
}

function fmtTime(t) {
  return new Date(t || Date.now()).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}

function scrollEnd() {
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
}

async function copyText(text, button, label) {
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (err) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      ok = document.execCommand("copy");
      document.body.removeChild(ta);
    } catch (e) {}
  }
  button.textContent = ok ? "✅ Copiado" : "Não foi possível copiar";
  setTimeout(() => { button.textContent = label; }, 2000);
}

// Separa "```linguagem\ncódigo" em { lang, code }.
function parseFence(part) {
  const nl = part.indexOf("\n");
  let lang = "";
  let code = part;
  if (nl !== -1) {
    const first = part.slice(0, nl).trim();
    if (first.length <= 15 && /^[\w+#.-]*$/.test(first)) {
      lang = first;
      code = part.slice(nl + 1);
    }
  }
  return { lang, code: code.replace(/\s+$/, "") };
}

// Só os blocos de código da resposta (sem o texto ao redor).
function extractCode(text) {
  const parts = String(text).split("```");
  const blocks = [];
  for (let i = 1; i < parts.length; i += 2) {
    const { code } = parseFence(parts[i]);
    if (code) blocks.push(code);
  }
  return blocks.join("\n\n");
}

function makeCodeBlock(code, lang) {
  const box = document.createElement("div");
  box.className = "codeblock";

  const head = document.createElement("div");
  head.className = "code-head";

  const name = document.createElement("span");
  name.textContent = lang || "código";

  const btn = document.createElement("button");
  btn.textContent = "📋 Copiar código";
  btn.addEventListener("click", () => copyText(code, btn, "📋 Copiar código"));

  head.append(name, btn);

  const pre = document.createElement("pre");
  pre.textContent = code;

  box.append(head, pre);
  return box;
}

function renderRich(container, text) {
  container.textContent = "";
  String(text).split("```").forEach((part, i) => {
    if (i % 2 === 1) {
      const { lang, code } = parseFence(part);
      if (code) container.appendChild(makeCodeBlock(code, lang));
    } else if (part.trim()) {
      const p = document.createElement("div");
      p.className = "txt";
      p.textContent = part.trim();
      container.appendChild(p);
    }
  });
}

function setBody(div, text) {
  const body = div.querySelector(".body");
  if (String(text).includes("```")) renderRich(body, text);
  else body.textContent = text;
}

function addMessage(role, text, t) {
  const div = document.createElement("div");
  div.className = "message " + role;

  const body = document.createElement("div");
  body.className = "body";
  div.appendChild(body);

  if (role === "user" || role === "assistant") {
    const time = document.createElement("small");
    time.className = "msg-time";
    time.textContent = fmtTime(t);
    div.appendChild(time);
  }

  chat.appendChild(div);
  setBody(div, text);
  scrollEnd();
  return div;
}

function createSourcesBox() {
  const box = document.createElement("div");
  box.className = "sources";
  chat.appendChild(box);
  return box;
}

function renderSources(box, sources, title, startedAt, done) {
  box.textContent = "";

  const seconds = ((performance.now() - startedAt) / 1000).toFixed(1);

  const head = document.createElement("div");
  head.className = "src-head";
  head.textContent = done
    ? "🔎 " + title + " · " + seconds + "s"
    : "⏳ " + title + "... " + seconds + "s";
  box.appendChild(head);

  sources.forEach(src => {
    const row = document.createElement("div");
    row.className = "src-item";

    const icon = document.createElement("span");
    icon.textContent =
      src.state === "loading" ? "⏳" : src.state === "ok" ? "✅" : "❌";
    row.appendChild(icon);

    let label;

    if (/^https:\/\//.test(src.url || "")) {
      label = document.createElement("a");
      label.href = src.url;
      label.target = "_blank";
      label.rel = "noopener noreferrer";
    } else {
      label = document.createElement("span");
    }

    label.textContent = src.name;
    row.appendChild(label);

    if (src.state !== "loading") {
      const time = document.createElement("small");
      time.textContent = (src.ms / 1000).toFixed(1) + "s";
      row.appendChild(time);
    }

    box.appendChild(row);
  });
}

function newSource(name, url, sources, onChange) {
  const item = {
    name,
    url,
    state: "loading",
    ms: 0,
    started: performance.now()
  };

  sources.push(item);
  if (onChange) onChange();
  return item;
}

function finishSource(item, ok, onChange, extra) {
  item.state = ok ? "ok" : "fail";
  item.ms = performance.now() - item.started;

  if (extra) {
    if (extra.name) item.name = extra.name;
    if (extra.url) item.url = extra.url;
  }

  if (onChange) onChange();
}

function addActions(text) {
  const row = document.createElement("div");
  row.className = "actions";

  const all = document.createElement("button");
  all.className = "copy";
  all.textContent = "📋 Copiar resposta";
  all.addEventListener("click", () => copyText(text, all, "📋 Copiar resposta"));
  row.appendChild(all);

  const code = extractCode(text);
  if (code) {
    const only = document.createElement("button");
    only.className = "copy";
    only.textContent = "💻 Copiar só o código";
    only.addEventListener("click", () => copyText(code, only, "💻 Copiar só o código"));
    row.appendChild(only);
  }

  chat.appendChild(row);
}

function updateButtons() {
  $("send").disabled = busy;
  $("load").disabled = busy || !!loadingPromise;
  $("restart").disabled = busy || resetting || !!loadingPromise;
  $("weather").disabled = busy;
  $("webToggle").disabled = busy;
}

// ------------------------------
// Histórico compacto
// ------------------------------

const MAX_QUESTIONS = 34;

// Mantém no máximo 34 perguntas (cada uma com a sua resposta).
function trimQuestions(list) {
  let count = list.filter(m => m.role === "user").length;
  let i = 0;

  while (count > MAX_QUESTIONS && i < list.length) {
    if (list[i].role === "user") count--;
    i++;
  }

  // Não deixa uma resposta sem a pergunta no começo.
  if (i > 0) {
    while (i < list.length && list[i].role === "assistant") i++;
  }

  return list.slice(i);
}

function saveHistory() {
  history = trimQuestions(history);
  try {
    localStorage.setItem(
      "rizik_history",
      JSON.stringify(history)
    );
  } catch (err) {
    console.warn("Erro ao salvar histórico:", err);
  }
}

function restoreHistory() {
  try {
    const saved = JSON.parse(
      localStorage.getItem("rizik_history") || "[]"
    );

    history = Array.isArray(saved)
      ? saved.filter(m =>
          m &&
          ["user", "assistant"].includes(m.role) &&
          typeof m.content === "string"
        )
      : [];

    history = trimQuestions(history);

    history.forEach(m => {
      addMessage(m.role, m.content, m.t);
      if (m.role === "assistant") addActions(m.content);
    });

  } catch (err) {
    history = [];
  }
}

function limitText(text, maxChars) {
  text = String(text || "");
  return text.length > maxChars
    ? text.slice(0, maxChars) + "\n[Conteúdo reduzido.]"
    : text;
}

function buildMessages(text, extraContext) {
  const isCode = !extraContext && looksLikeCode(text);

  const messages = [
    { role: "system", content: isCode ? SYSTEM_CODE : SYSTEM_CHAT }
  ];

  // Textos longos (código) ocupam o contexto: sem histórico.
  const recent = (isCode && text.length > 1200) ? [] : history.slice(-4);

  for (const item of recent) {
    messages.push({
      role: item.role,
      content: limitText(item.content, item.role === "assistant" ? 500 : 300)
    });
  }

  const tips = isCode ? pickTips(text) : "";
  const safeResearch = extraContext ? limitText(extraContext, 900) : "";

  messages.push({
    role: "user",
    content:
      limitText(text, MAX_USER_CHARS) +
      (tips ? "\n\nDicas úteis:\n" + tips : "") +
      (safeResearch
        ? "\n\nUse somente as informações abaixo. Se não tiverem relação com a pergunta, diga que não encontrou.\nInformações:\n" + safeResearch
        : "")
  });

  return messages;
}

// ------------------------------
// Identificação de falhas
// ------------------------------

function isEngineCrash(err) {
  const message = String(
    err && err.message ? err.message : err
  );

  return /ABORT|wllama has crashed|RuntimeError|memory access out of bounds|unreachable|out of memory/i.test(message);
}

// ------------------------------
// Encerrar motor anterior
// ------------------------------

async function destroyAI() {
  const oldAI = ai;

  // Impede que outra parte do código reutilize a instância.
  ai = null;
  ready = false;

  if (oldAI) {
    try {
      await oldAI.exit();
    } catch (err) {
      console.warn("O motor anterior já estava encerrado:", err);
    }
  }
}

// ------------------------------
// Carregar modelo
// ------------------------------

async function loadAI() {
  if (ready && ai) {
    sayStatus("A IA já está carregada!");
    return true;
  }

  if (loadingPromise) {
    return loadingPromise;
  }

  $("load").disabled = true;

  loadingPromise = (async () => {
    let newAI = null;

    try {
      sayStatus("Preparando o motor da IA...");

      newAI = new Wllama(WasmFromCDN);
      newAI.setCompat("default");

      ai = newAI;
      ready = false;

      sayStatus("Carregando modelo Qwen...");

      await newAI.loadModelFromUrl(MODEL_URL, {
        n_ctx: N_CTX,
        n_batch: 256,
        n_threads: THREADS,
        n_gpu_layers: 0,

        progressCallback: ({loaded, total}) => {
          if (total > 0) {
            const percent = Math.round(loaded / total * 100);
            sayStatus("Baixando modelo: " + percent + "%");
          } else {
            sayStatus("Baixando modelo...");
          }
        }
      });

      // Confere se a instância continua sendo a atual.
      if (ai !== newAI) {
        try { await newAI.exit(); } catch (_) {}
        return false;
      }

      ready = true;

      sayStatus("Rizik está pronto!");
      addMessage(
        "system",
        "Rizik AI carregado com sucesso! 🚀\nNúcleos em uso: " + THREADS +
        (self.crossOriginIsolated
          ? " (modo rápido ativo)"
          : " (modo rápido inativo)")
      );

      return true;

    } catch (err) {
      console.error("Erro ao carregar Wllama:", err);

      if (newAI) {
        try { await newAI.exit(); } catch (_) {}
      }

      if (ai === newAI) {
        ai = null;
      }

      ready = false;

      const message = err?.message || String(err);

      sayStatus("Falha ao carregar a IA.");
      addMessage("system", "Erro ao carregar: " + message);

      return false;

    } finally {
      loadingPromise = null;
      updateButtons();
    }
  })();

  return loadingPromise;
}

// ------------------------------
// Reiniciar motor sem atualizar página
// ------------------------------

async function restartAI() {
  if (busy || resetting || loadingPromise) {
    return;
  }

  resetting = true;
  updateButtons();

  try {
    sayStatus("Encerrando o motor anterior...");

    await destroyAI();

    sayStatus("Motor encerrado. Preparando nova instância...");

    await new Promise(resolve => setTimeout(resolve, 300));

    const success = await loadAI();

    if (success) {
      addMessage("system", "Motor da IA reiniciado com sucesso. 🚀");
    } else {
      sayStatus("Não foi possível reiniciar. Tente novamente.");
    }

  } catch (err) {
    console.error("Erro ao reiniciar:", err);
    sayStatus("Falha ao reiniciar o motor.");
  } finally {
    resetting = false;
    updateButtons();
  }
}

// ------------------------------
// Gerar resposta
// ------------------------------

async function generate(text, extraContext = "", opts = {}) {
  if (busy || resetting) return;

  busy = true;
  updateButtons();

  const shown = opts.shown || text;
  let answerBox = null;
  let currentEngine = null;
  let thinkTimer = null;
  let thinkStart = 0;

  try {
    if (!opts.skipUser) addMessage("user", shown);

    if (!ready || !ai) {
      sayStatus("Carregando a IA...");

      const loaded = await loadAI();

      if (!loaded || !ready || !ai) {
        addMessage(
          "system",
          "Não consegui iniciar a IA. Abra ⋮ > Reiniciar IA e tente novamente."
        );
        return;
      }
    }

    currentEngine = ai;

    const messages = buildMessages(text, extraContext);

    history.push({ role: "user", content: limitText(shown, 4000), t: Date.now() });
    saveHistory();

    // Os três pontinhos animados ficam até a resposta ficar pronta.
    answerBox = addMessage("assistant", "");
    answerBox.querySelector(".body").innerHTML =
      '<span class="dots"><span></span><span></span><span></span></span>';

    const timerBox = addMessage("system", "⏱ 0s · lendo a pergunta...");
    timerBox.style.alignSelf = "flex-start";

    thinkStart = performance.now();
    let tokenCount = 0;
    let firstTokenAt = 0;

    const showTimer = () => {
      const seconds = (performance.now() - thinkStart) / 1000;

      timerBox.textContent = !firstTokenAt
        ? "⏱ " + Math.round(seconds) + "s · lendo a pergunta..."
        : "⏱ " + Math.round(seconds) + "s · escrevendo a resposta · " + tokenCount + " partes";

      sayStatus("Rizik está pensando... " + Math.round(seconds) + "s");
    };

    showTimer();
    thinkTimer = setInterval(showTimer, 500);

    const stream = await currentEngine.createChatCompletion({
      messages,
      max_tokens: settings.tokens,
      temperature: settings.temp,
      top_p: 0.9,
      stream: true
    });

    let answer = "";
    let truncated = false;

    // A resposta é montada por inteiro; só aparece quando termina.
    for await (const chunk of stream) {
      if (ai !== currentEngine || !ready) {
        throw new Error("O motor foi reiniciado durante a geração.");
      }

      const choice = chunk?.choices?.[0];
      const piece = choice?.delta?.content ?? "";

      if (choice?.finish_reason === "length") truncated = true;

      if (piece) {
        if (!firstTokenAt) firstTokenAt = performance.now();
        tokenCount++;
        answer += piece;
      }
    }

    answer = answer.trim() || "Não consegui gerar uma resposta.";

    clearInterval(thinkTimer);
    thinkTimer = null;

    setBody(answerBox, answer);
    answerBox.querySelector(".msg-time").textContent = fmtTime();
    lastAnswer = answer;

    const totalSeconds = (performance.now() - thinkStart) / 1000;
    const waitSeconds = firstTokenAt
      ? (firstTokenAt - thinkStart) / 1000
      : totalSeconds;

    timerBox.textContent =
      "⏱ Total " + totalSeconds.toFixed(1) + "s · " +
      "leitura " + waitSeconds.toFixed(1) + "s · " +
      tokenCount + " partes" +
      (truncated ? " · cortada pelo limite (aumente em ⋮ Configurações)" : "");

    addActions(answer);
    scrollEnd();

    history.push({ role: "assistant", content: limitText(answer, 4000), t: Date.now() });
    saveHistory();

  } catch (err) {
    console.error("Erro na resposta:", err);

    const message = err?.message || String(err);
    let text2;

    if (isEngineCrash(err)) {
      sayStatus("O motor travou. Preparando recuperação...");

      // Descarta a instância que apresentou falha.
      await destroyAI();

      text2 =
        "O motor da IA travou durante a geração.\n\n" +
        "A instância com erro foi descartada. Abra ⋮ > Reiniciar IA para carregar o modelo novamente.";
    } else {
      text2 = "Erro ao responder: " + message;
    }

    if (answerBox) setBody(answerBox, text2);
    else addMessage("system", text2);

  } finally {
    if (thinkTimer) clearInterval(thinkTimer);

    busy = false;
    updateButtons();

    sayStatus(
      ready
        ? "Rizik está pronto."
        : "Motor aguardando reinicialização."
    );
  }
}

// ------------------------------
// Clima: detectar pergunta e cidade
// ------------------------------

const WEATHER_WORDS = /\b(tempo de chuva|clima|chuva|chover|chovendo|previs[aã]o|temperatura|calor|frio)\b/i;

function isWeatherQuestion(text) {
  return WEATHER_WORDS.test(text);
}

// Pega o texto depois da ÚLTIMA preposição de lugar (em, para, na, no).
// Se não achar, tenta "de/da/do". Se ainda não achar, usa a cidade padrão.
function extractCity(text) {
  const clean = String(text).trim();

  let m = clean.match(/^.*\b(?:em|para|na|no)\s+([A-Za-zÀ-ú\s'-]+?)\s*[?!.]*\s*$/i);
  if (!m) m = clean.match(/^.*\b(?:de|da|do)\s+([A-Za-zÀ-ú\s'-]+?)\s*[?!.]*\s*$/i);

  const city = m ? m[1].trim() : "";

  // Evita pegar palavras que não são cidade (ex.: "tempo de chuva").
  if (!city || WEATHER_WORDS.test(city) || /^(hoje|amanh[ãa]|agora)$/i.test(city)) {
    return settings.city || "Nova Esperança";
  }

  return city;
}

// Eventos principais

let webMode = false;
let searching = false;

function setWebMode(on) {
  webMode = on;
  $("webToggle").classList.toggle("on", on);
  $("webToggle").setAttribute("aria-pressed", on ? "true" : "false");
  input.placeholder = on ? "Pesquisar na internet..." : "Converse com o Rizik...";
}

$("load").addEventListener("click", loadAI);

$("restart").addEventListener("click", () => {
  closeMenu();
  restartAI();
});

$("webToggle").addEventListener("click", () => {
  setWebMode(!webMode);
  input.focus();
});

$("send").addEventListener("click", async () => {
  const text = input.value.trim();

  if (!text || busy || resetting || searching) return;

  input.value = "";
  const wasWeb = webMode;
  setWebMode(false); // a pesquisa vale para uma mensagem só

  // Perguntas sobre o tempo usam a previsão real, não o modelo.
  if (isWeatherQuestion(text) && !looksLikeCode(text)) {
    addMessage("user", text);
    await runWeather(extractCity(text));
    return;
  }

  if (wasWeb) {
    await runSearch(text);
    return;
  }

  await generate(text);
});

input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    $("send").click();
  }
});

  history = [];

// ----- Histórico de perguntas -----

const histPanel = $("hist");

function openHistory() {
  closeMenu();

  const questions = history.filter(m => m.role === "user").reverse();
  const list = $("histList");
  list.textContent = "";

  $("histTitle").textContent =
    "Histórico · " + questions.length + " de " + MAX_QUESTIONS + " perguntas";

  if (!questions.length) {
    const empty = document.createElement("div");
    empty.className = "hist-item";
    empty.textContent = "Nenhuma pergunta ainda.";
    list.appendChild(empty);
  }

  questions.forEach(q => {
    const item = document.createElement("button");
    item.className = "hist-item";

    const time = document.createElement("small");
    time.textContent = q.t
      ? new Date(q.t).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })
      : "";

    const text = document.createElement("span");
    text.textContent = limitText(q.content, 140);

    item.append(time, text);

    // Toque para colocar a pergunta de volta na barra de mensagens.
    item.addEventListener("click", () => {
      input.value = q.content;
      histPanel.hidden = true;
      input.focus();
    });

    list.appendChild(item);
  });

  histPanel.hidden = false;
}

$("histBtn").addEventListener("click", openHistory);
$("histClose").addEventListener("click", () => { histPanel.hidden = true; });

});

function tickClock() {

$("speak").addEventListener("click", () => {
  closeMenu();

  if (!lastAnswer) {
    addMessage("system", "Ainda não existe resposta para ler.");
    return;
  }

  if (!("speechSynthesis" in window)) {
    addMessage("system", "Leitura de voz indisponível.");
    return;
  }

  // Não lê o código em voz alta.
  const spoken = lastAnswer.replace(/```[\s\S]*?(```|$)/g, " (código omitido) ");

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(spoken);
  utterance.lang = "pt-BR";
  speechSynthesis.speak(utterance);
});

  closeMenu();
  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }
});

// ------------------------------
// Pesquisa na internet
// ------------------------------

async function fetchTextWithTimeout(url, milliseconds) {
  const controller = new AbortController();

  const timer = setTimeout(
    () => controller.abort(),
    milliseconds
  );

  try {
    const response = await fetch(url, {
      headers: {"Accept": "text/plain"},
      signal: controller.signal,
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Serviço respondeu HTTP " + response.status);
    }

    return await response.text();

  } finally {
    clearTimeout(timer);
  }
}

async function searchWikipedia(query) {
  const url =
    "https://pt.wikipedia.org/w/api.php?action=query&generator=search" +
    "&gsrsearch=" + encodeURIComponent(query) +
    "&gsrlimit=1&prop=extracts&exintro=1&explaintext=1&exchars=900" +
    "&format=json&origin=*";

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error("Wikipedia respondeu HTTP " + response.status);
  }

  const data = await response.json();
  const pages = data && data.query && data.query.pages;

  if (!pages) {
    throw new Error("Sem resultados na Wikipedia.");
  }

  const page = Object.values(pages)[0];

  if (!page || !page.extract) {
    throw new Error("Sem resultados na Wikipedia.");
  }

  return "Wikipedia: " + page.title + "\n" + page.extract;
}

async function searchWeb(query, sources, onChange) {
  const wiki = newSource(
    "pt.wikipedia.org",
    "https://pt.wikipedia.org",
    sources,
    onChange
  );

  try {
    const wikiText = await searchWikipedia(query);
    const title = wikiText.split("\n")[0].replace("Wikipedia: ", "");

    finishSource(wiki, true, onChange, {
      name: "pt.wikipedia.org → " + title,
      url: "https://pt.wikipedia.org/wiki/" +
        encodeURIComponent(title.replace(/ /g, "_"))
    });

    return wikiText;

  } catch (err) {
    finishSource(wiki, false, onChange);
    console.warn("Wikipedia falhou, tentando outra fonte:", err);
  }

  const encoded = encodeURIComponent(query);

  const endpoints = [
    {
      name: "duckduckgo.com (via r.jina.ai)",
      site: "https://duckduckgo.com",
      url: "https://r.jina.ai/http://html.duckduckgo.com/html/?q=" + encoded
    },
    {
      name: "google.com (via r.jina.ai)",
      site: "https://www.google.com",
      url: "https://r.jina.ai/http://www.google.com/search?q=" + encoded
    }
  ];

  let lastError = null;

  for (const endpoint of endpoints) {
    const source = newSource(endpoint.name, endpoint.site, sources, onChange);

    try {
      const result = await fetchTextWithTimeout(endpoint.url, 20000);

      if (result && result.trim().length > 100) {
        finishSource(source, true, onChange);
        return result.slice(0, 900);
      }

      throw new Error("Pesquisa sem resultados suficientes.");

    } catch (err) {
      finishSource(source, false, onChange);
      lastError = err;
      console.warn("Fonte de pesquisa falhou:", err);
    }
  }

  throw lastError || new Error("Pesquisa indisponível.");
}

async function runSearch(rawQuery) {
  const original = rawQuery.trim();

  // Texto muito longo não é pesquisa: responde direto.
  if (original.length > 160) {
    addMessage("system", "Texto longo demais para pesquisar: respondendo direto.");
    await generate(original);
    return;
  }

  searching = true;
  addMessage("user", original);

  // Tira as palavras de pedido para a Wikipedia achar o assunto certo.
  const query = original
    .replace(/^\s*(pesquis[ea]r?|me\s+explique|me\s+fale|explique|fale)\s+(sobre\s+)?/i, "")
    .replace(/^\s*(o\s+que\s+(é|são)|quem\s+(é|foi)|o\s+que\s+significa)\s+/i, "")
    .replace(/\?+\s*$/, "")
    .trim() || original;

  const sources = [];
  const searchStart = performance.now();
  const box = createSourcesBox();
  let searchDone = false;

  const refresh = () =>
    renderSources(box, sources, "Pesquisando na internet", searchStart, searchDone);

  const searchTimer = setInterval(() => {
    refresh();
    sayStatus(
      "Pesquisando na internet... " +
      Math.round((performance.now() - searchStart) / 1000) + "s"
    );
  }, 500);

  refresh();
  scrollEnd();

  try {
    const results = await searchWeb(query, sources, refresh);

    clearInterval(searchTimer);
    searchDone = true;
    renderSources(box, sources, "Fontes consultadas", searchStart, true);

    searching = false;

    await generate("Explique de forma curta: " + query, results, {
      shown: original,
      skipUser: true
    });

    // As fontes ficam logo abaixo da resposta.
    chat.appendChild(box);
    scrollEnd();

  } catch (err) {
    clearInterval(searchTimer);
    searchDone = true;
    renderSources(box, sources, "Fontes consultadas", searchStart, true);

    console.error("Erro na pesquisa:", err);
    sayStatus("Pesquisa indisponível.");

    addMessage(
      "system",
      "Não consegui pesquisar agora: " + (err.message || String(err))
    );

  } finally {
    searching = false;
  }
}

// ------------------------------
// Clima
// ------------------------------

const WEATHER_TEXT = code => {
  if (code === 0) return "céu limpo";
  if (code <= 3) return "parcialmente nublado";
  if (code === 45 || code === 48) return "neblina";
  if (code >= 51 && code <= 57) return "garoa";
  if (code >= 61 && code <= 67) return "chuva";
  if (code >= 71 && code <= 77) return "neve";
  if (code >= 80 && code <= 82) return "pancadas de chuva";
  if (code >= 95) return "trovoadas";
  return "tempo variável";
};

function shortDate(iso) {
  const parts = String(iso).split("-");
  return parts.length === 3 ? parts[2] + "/" + parts[1] : iso;
}

async function runWeather(city) {
  const started = performance.now();
  const sources = [];
  const box = createSourcesBox();
  const refresh = () =>
    renderSources(box, sources, "Consultando a previsão", started, false);

  refresh();
  sayStatus("Consultando previsão do tempo...");

  try {
    const geoSrc = newSource(
      "geocoding-api.open-meteo.com",
      "https://open-meteo.com",
      sources,
      refresh
    );

    const geoResponse = await fetch(
      "https://geocoding-api.open-meteo.com/v1/search?name=" +
      encodeURIComponent(city) +
      "&count=5&language=pt&format=json"
    );

    finishSource(geoSrc, geoResponse.ok, refresh);

    if (!geoResponse.ok) {
      throw new Error("Erro ao localizar cidade.");
    }

    const geo = await geoResponse.json();

    if (!geo.results || !geo.results.length) {
      throw new Error("Cidade não encontrada.");
    }

    const place =
      geo.results.find(r => r.country_code === "BR") || geo.results[0];

    const weatherSrc = newSource(
      "api.open-meteo.com",
      "https://open-meteo.com",
      sources,
      refresh
    );

    const weatherUrl =
      "https://api.open-meteo.com/v1/forecast?latitude=" +
      place.latitude +
      "&longitude=" +
      place.longitude +
      "&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
      "&timezone=auto&forecast_days=3";

    const weatherResponse = await fetch(weatherUrl);

    finishSource(weatherSrc, weatherResponse.ok, refresh);

    if (!weatherResponse.ok) {
      throw new Error("Erro ao consultar previsão.");
    }

    const data = await weatherResponse.json();
    const c = data.current;
    const d = data.daily;

    const days = d.time.map((day, i) =>
      (i === 0 ? "Hoje" : shortDate(day)) +
      ": " + WEATHER_TEXT(d.weather_code[i]) +
      ", mín " + d.temperature_2m_min[i] + "°C, máx " +
      d.temperature_2m_max[i] + "°C, chuva " +
      d.precipitation_probability_max[i] + "%"
    ).join("\n");

    const report =
      "🌤️ Clima em " + place.name +
      (place.admin1 ? " - " + place.admin1 : "") + "\n\n" +
      "Agora: " + c.temperature_2m + "°C (sensação " +
      c.apparent_temperature + "°C), " + WEATHER_TEXT(c.weather_code) + "\n" +
      "Umidade " + c.relative_humidity_2m + "% · Vento " +
      c.wind_speed_10m + " km/h · Chuva agora " + c.precipitation + " mm\n\n" +
      days;

    addMessage("assistant", report);
    lastAnswer = report;

    renderSources(box, sources, "Fontes da previsão", started, true);
    chat.appendChild(box);

    sayStatus(ready ? "Rizik está pronto." : "Rizik está aguardando.");

  } catch (err) {
    console.error("Erro no clima:", err);
    renderSources(box, sources, "Fontes da previsão", started, true);
    sayStatus("Erro ao consultar o clima.");
    addMessage("system", err.message || String(err));
  }
}

$("weather").addEventListener("click", async () => {
  if (busy || resetting || searching) return;
  await runWeather(settings.city || "Nova Esperança");
});
