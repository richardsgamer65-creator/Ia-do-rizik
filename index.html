
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10111a">
<title>Rizik AI</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#10111a;color:#f5f5fa;font-family:system-ui,sans-serif}
header{padding:16px;background:#191b29;display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px;margin:0}
main{max-width:850px;margin:auto;padding:14px}
#status{font-size:13px;color:#aeb4ca;margin:10px 0;overflow-wrap:anywhere}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button{border:0;border-radius:12px;padding:12px;background:#292d40;color:white;font-size:14px}
button:disabled{opacity:.5}
.primary{background:#7259e8}
#chat{display:flex;flex-direction:column;gap:12px;min-height:48vh;padding-bottom:15px}
.message{padding:13px 15px;border-radius:16px;max-width:95%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.user{background:#624bd1;align-self:flex-end}
.assistant{background:#202333;align-self:flex-start}
.system{background:#292d40;color:#c4c9db;align-self:center;font-size:13px}
.composer{position:sticky;bottom:0;background:#10111a;padding:10px 0 calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
textarea{flex:1;min-width:0;resize:vertical;min-height:48px;max-height:180px;border-radius:14px;border:1px solid #383c50;background:#1b1e2b;color:white;padding:13px;font:inherit}
#send{background:#7259e8;font-weight:bold}
.info{font-size:12px;color:#9299b0;margin-top:12px;line-height:1.5}
</style>
</head>

<body>

<header>
  <div>
    <h1>✨ Rizik AI</h1>
    <small>Seu assistente pessoal</small>
  </div>
  <button id="clear">Limpar</button>
</header>

<main>

  <div id="status">Rizik está aguardando.</div>

  <div class="toolbar">
    <button id="load" class="primary">Carregar IA</button>
    <button id="search">🌐 Pesquisar</button>
    <button id="weather">🌤️ Clima</button>
    <button id="speak">🔊 Ler resposta</button>
    <button id="stop">Parar voz</button>
  </div>

  <div id="chat"></div>

  <div class="composer">
    <textarea id="prompt" placeholder="Converse com o Rizik..." rows="2"></textarea>
    <button id="send">Enviar</button>
  </div>

  <div class="info">
    Modelo local Qwen 0.5B. Primeiro carregamento: aproximadamente 398 MB.
    A pesquisa e o clima precisam de internet.
  </div>

</main>

<script type="module">

import { Wllama } from "https://cdn.jsdelivr.net/npm/@wllama/wllama@3.13.0/esm/index.js";
import WasmFromCDN from "https://cdn.jsdelivr.net/npm/@wllama/wllama@3.13.0/esm/wasm-from-cdn.js";

const $ = id => document.getElementById(id);

const chat = $("chat");
const status = $("status");
const input = $("prompt");

const MODEL_URL =
"https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf";

const SYSTEM_PROMPT = `
Você é Rizik AI, um assistente pessoal inteligente, amigável e especialista em tecnologia.

IDIOMA:
- Fale sempre em português brasileiro.
- Seja natural, claro, educado e direto.
- Explique de maneira fácil quando o usuário for iniciante.

PROGRAMAÇÃO:
- Você é especialista em HTML, CSS, JavaScript, Python, Java, Kotlin, C, C++, SQL, JSON, APIs e desenvolvimento de aplicativos.
- Ajude a criar sites, aplicativos, assistentes de inteligência artificial e sistemas.
- Analise códigos que o usuário colar na conversa.
- Identifique erros de sintaxe, lógica, incompatibilidade e problemas de funcionamento.
- Quando o usuário pedir para corrigir um código, entregue o código completo atualizado sempre que possível.
- Não entregue somente pequenos trechos quando o usuário pedir o projeto completo.
- Preserve as funcionalidades que já existem.
- Não invente bibliotecas, funções ou APIs.
- Explique onde o código deve ser colocado e como testar.
- Se faltar alguma informação, pergunte antes de inventar.
- Se o código for muito grande, explique que pode ser necessário dividi-lo em partes.

CONHECIMENTO:
- Use o histórico disponível da conversa para manter o contexto.
- Considere os códigos e informações que o usuário colar como referência.
- Nunca diga que consegue acessar arquivos, conversas externas ou códigos que não foram fornecidos nesta conversa.
- Não invente resultados de testes que não realizou.

PESQUISA:
- Quando receber resultados da internet, analise o conteúdo fornecido.
- Diferencie informações encontradas de informações que você já conhece.
- Não afirme que pesquisou se não recebeu resultados.

PERSONALIDADE:
- Seja prestativo, inteligente, criativo e bem-humorado quando combinar.
- Ajude o usuário a resolver problemas passo a passo.
- Dê prioridade a soluções práticas.
`;

let ai = null;
let ready = false;
let loadingPromise = null;
let busy = false;
let history = [];
let lastAnswer = "";

function sayStatus(text) {
  status.textContent = text;
}

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "message " + role;
  div.textContent = text;
  chat.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
  return div;
}

function saveHistory() {
  try {
    localStorage.setItem(
      "rizik_history",
      JSON.stringify(history.slice(-40))
    );
  } catch (err) {
    console.warn("Erro ao salvar histórico:", err);
  }
}

function restoreHistory() {
  try {
    const saved = JSON.parse(
      localStorage.getItem("rizik_history") || "[]"
    );

    history = Array.isArray(saved)
      ? saved.filter(m =>
          m &&
          ["user", "assistant"].includes(m.role) &&
          typeof m.content === "string"
        ).slice(-40)
      : [];

    history.forEach(m => {
      addMessage(m.role, m.content);
    });

  } catch (err) {
    history = [];
  }
}

// Limita o texto para proteger o contexto de 2048 tokens.
function limitText(text, maxChars) {
  text = String(text || "");

  if (text.length <= maxChars) {
    return text;
  }

  return text.slice(0, maxChars) +
    "\n\n[Conteúdo reduzido para caber na memória da IA.]";
}

// Monta um histórico compacto para não ultrapassar o contexto.
function buildMessages(text, extraContext) {

  const messages = [
    {
      role: "system",
      content: SYSTEM_PROMPT
    }
  ];

  // Recupera somente as mensagens recentes.
  const recent = history.slice(-4);

  let historyBudget = 650;

  for (const item of recent) {
    if (historyBudget <= 0) break;

    const content = limitText(
      item.content,
      Math.min(350, historyBudget)
    );

    messages.push({
      role: item.role,
      content
    });

    historyBudget -= content.length;
  }

  const safeText = limitText(text, 900);

  const safeResearch = extraContext
    ? limitText(extraContext, 850)
    : "";

  messages.push({
    role: "user",
    content:
      safeText +
      (safeResearch
        ? "\n\nResultados da pesquisa:\n" + safeResearch
        : "")
  });

  return messages;
}

// Carregar modelo
async function loadAI() {

  if (ready) {
    sayStatus("A IA já está carregada!");
    return true;
  }

  if (loadingPromise) {
    return loadingPromise;
  }

  $("load").disabled = true;

  loadingPromise = (async () => {

    try {

      sayStatus("Preparando o motor da IA...");

      ai = new Wllama(WasmFromCDN);

      // Compatibilidade com navegadores como Safari.
      ai.setCompat("default");

      sayStatus("Conectando ao modelo Qwen...");

      await ai.loadModelFromUrl(MODEL_URL, {
        n_ctx: 2048,
        n_threads: 2,

        progressCallback: ({loaded, total}) => {
          if (total > 0) {
            const percent = Math.round(
              loaded / total * 100
            );

            sayStatus("Baixando modelo: " + percent + "%");
          } else {
            sayStatus("Baixando modelo...");
          }
        }
      });

      ready = true;

      sayStatus("Rizik está pronto!");

      addMessage(
        "system",
        "Rizik AI carregado com sucesso! 🚀"
      );

      return true;

    } catch (err) {

      console.error("Erro ao carregar:", err);

      const message = err && err.message
        ? err.message
        : String(err);

      sayStatus("Falha ao carregar a IA.");

      addMessage(
        "system",
        "Erro ao carregar: " + message
      );

      ai = null;
      ready = false;

      return false;

    } finally {

      $("load").disabled = false;
      loadingPromise = null;

    }

  })();

  return loadingPromise;
}

// Gerar resposta
async function generate(text, extraContext = "") {

  if (busy) return;

  busy = true;
  $("send").disabled = true;

  let answerBox = null;

  try {

    // Carrega a IA automaticamente se necessário.
    if (!ready) {

      sayStatus("Carregando a IA...");

      const loaded = await loadAI();

      if (!loaded) {
        addMessage(
          "system",
          "Não consegui iniciar a IA. Tente carregar novamente."
        );
        return;
      }
    }

    addMessage("user", text);

    const messages = buildMessages(
      text,
      extraContext
    );

    history.push({
      role: "user",
      content: text
    });

    saveHistory();

    answerBox = addMessage(
      "assistant",
      "Pensando..."
    );

    sayStatus("Rizik está pensando...");

    const result = await ai.createChatCompletion({

      messages: messages,

      max_tokens: 250,

      temperature: 0.6,

      top_p: 0.9

    });

    const answer =
      result &&
      result.choices &&
      result.choices[0] &&
      result.choices[0].message &&
      result.choices[0].message.content
        ? result.choices[0].message.content.trim()
        : "Não consegui gerar uma resposta.";

    answerBox.textContent = answer;

    lastAnswer = answer;

    history.push({
      role: "assistant",
      content: answer
    });

    saveHistory();

  } catch (err) {

    console.error("Erro na resposta:", err);

    const message = err && err.message
      ? err.message
      : String(err);

    if (answerBox) {
      answerBox.textContent =
        "Erro ao responder: " + message;
    } else {
      addMessage(
        "system",
        "Erro ao responder: " + message
      );
    }

  } finally {

    busy = false;
    $("send").disabled = false;

    sayStatus(
      ready
        ? "Rizik está pronto."
        : "Rizik está aguardando."
    );

  }
}

// Botão carregar
$("load").addEventListener("click", loadAI);

// Enviar mensagem
$("send").addEventListener("click", async () => {

  const text = input.value.trim();

  if (!text || busy) return;

  input.value = "";

  await generate(text);

});

// Enter envia
input.addEventListener("keydown", e => {

  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    $("send").click();
  }

});

// Limpar histórico
$("clear").addEventListener("click", () => {

  if (!confirm("Apagar toda a conversa?")) return;

  history = [];
  chat.innerHTML = "";
  lastAnswer = "";

  saveHistory();

});

// Ler resposta
$("speak").addEventListener("click", () => {

  if (!lastAnswer) {
    addMessage(
      "system",
      "Ainda não existe resposta para ler."
    );
    return;
  }

  if (!("speechSynthesis" in window)) {
    addMessage(
      "system",
      "Leitura de voz indisponível neste navegador."
    );
    return;
  }

  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(lastAnswer);

  utterance.lang = "pt-BR";

  speechSynthesis.speak(utterance);

});

// Parar voz
$("stop").addEventListener("click", () => {

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

});

// Pesquisa com tempo limite
async function fetchTextWithTimeout(url, milliseconds) {

  const controller = new AbortController();

  const timer = setTimeout(
    () => controller.abort(),
    milliseconds
  );

  try {

    const response = await fetch(url, {
      headers: {
        "Accept": "text/plain"
      },
      signal: controller.signal,
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(
        "Serviço respondeu HTTP " + response.status
      );
    }

    return await response.text();

  } finally {
    clearTimeout(timer);
  }

}

// Pesquisa na internet
async function searchWeb(query) {

  const encoded = encodeURIComponent(query);

  const endpoints = [

    "https://r.jina.ai/http://html.duckduckgo.com/html/?q=" +
    encoded,

    "https://r.jina.ai/http://www.google.com/search?q=" +
    encoded

  ];

  let lastError = null;

  for (const url of endpoints) {

    try {

      const result = await fetchTextWithTimeout(
        url,
        20000
      );

      if (result && result.trim().length > 100) {

        // Limita a pesquisa para proteger o contexto.
        return result.slice(0, 1200);

      }

      throw new Error("Pesquisa sem resultados suficientes.");

    } catch (err) {

      lastError = err;

      console.warn(
        "Fonte de pesquisa falhou:",
        err
      );

    }

  }

  throw lastError ||
    new Error("Pesquisa indisponível.");

}

// Botão pesquisar
$("search").addEventListener("click", async () => {

  const query = window.prompt(
    "O que você quer pesquisar?"
  );

  if (!query || !query.trim()) return;

  sayStatus("Pesquisando na internet...");

  addMessage(
    "system",
    "Pesquisando: " + query
  );

  try {

    const results = await searchWeb(query.trim());

    addMessage(
      "system",
      "Resultados encontrados. Analisando..."
    );

    await generate(
      "Pesquise e explique: " + query.trim(),
      results
    );

  } catch (err) {

    console.error("Erro na pesquisa:", err);

    sayStatus("Pesquisa indisponível.");

    addMessage(
      "system",
      "Não consegui pesquisar agora: " +
      (err.message || String(err))
    );

  }

});

// Clima
$("weather").addEventListener("click", async () => {

  const city = window.prompt(
    "Qual cidade?",
    "Nova Esperança"
  );

  if (!city || !city.trim()) return;

  sayStatus("Consultando previsão do tempo...");

  try {

    const geoResponse = await fetch(
      "https://geocoding-api.open-meteo.com/v1/search?name=" +
      encodeURIComponent(city.trim()) +
      "&count=1&language=pt&format=json"
    );

    if (!geoResponse.ok) {
      throw new Error("Erro ao localizar cidade.");
    }

    const geo = await geoResponse.json();

    if (!geo.results || !geo.results.length) {
      throw new Error("Cidade não encontrada.");
    }

    const place = geo.results[0];

    const weatherUrl =
      "https://api.open-meteo.com/v1/forecast?latitude=" +
      place.latitude +
      "&longitude=" +
      place.longitude +
      "&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
      "&timezone=auto&forecast_days=3";

    const weatherResponse = await fetch(weatherUrl);

    if (!weatherResponse.ok) {
      throw new Error("Erro ao consultar previsão.");
    }

    const data = await weatherResponse.json();

    const c = data.current;
    const d = data.daily;

    const report =
      "Clima de " + place.name + ", " +
      (place.admin1 || "") + ", " +
      (place.country || "") + "\n" +

      "Temperatura atual: " +
      c.temperature_2m + "°C\n" +

      "Sensação térmica: " +
      c.apparent_temperature + "°C\n" +

      "Umidade: " +
      c.relative_humidity_2m + "%\n" +

      "Vento: " +
      c.wind_speed_10m + " km/h\n" +

      "Precipitação atual: " +
      c.precipitation + " mm\n\n" +

      d.time.map((day, i) =>
        day +
        ": mínima " + d.temperature_2m_min[i] + "°C, " +
        "máxima " + d.temperature_2m_max[i] + "°C, " +
        "chance de chuva " +
        d.precipitation_probability_max[i] + "%"
      ).join("\n");

    addMessage(
      "system",
      "Previsão recebida para " + place.name
    );

    await generate(
      "Explique esta previsão do tempo:",
      report
    );

  } catch (err) {

    console.error("Erro no clima:", err);

    sayStatus("Erro ao consultar o clima.");

    addMessage(
      "system",
      err.message || String(err)
    );

  }

});

// Recuperar histórico
restoreHistory();

// Erros gerais
window.addEventListener("error", event => {

  console.error(
    "Erro JavaScript:",
    event.error || event.message
  );

  sayStatus(
    "Ocorreu um erro. Recarregue a página."
  );

});

window.addEventListener("unhandledrejection", event => {

  console.error(
    "Erro assíncrono:",
    event.reason
  );

});

</script>

</body>
</html>
