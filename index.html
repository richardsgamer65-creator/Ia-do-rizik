
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10111a">
<title>Rizik AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10111a;color:#f5f5fa;font-family:system-ui,sans-serif}
header{padding:16px;background:#191b29;display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px;margin:0}
main{max-width:850px;margin:auto;padding:14px}
#status{font-size:13px;color:#aeb4ca;margin:10px 0;overflow-wrap:anywhere}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button{border:0;border-radius:12px;padding:12px;background:#292d40;color:white;font-size:14px}
button:disabled{opacity:.5}
.primary{background:#7259e8}
#chat{display:flex;flex-direction:column;gap:12px;min-height:48vh;padding-bottom:15px}
.message{padding:13px 15px;border-radius:16px;max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.user{background:#624bd1;align-self:flex-end}
.assistant{background:#202333;align-self:flex-start}
.system{background:#292d40;color:#c4c9db;align-self:center;font-size:13px}
.composer{position:sticky;bottom:0;background:#10111a;padding:10px 0 calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
textarea{flex:1;min-width:0;resize:none;min-height:48px;max-height:130px;border-radius:14px;border:1px solid #383c50;background:#1b1e2b;color:white;padding:13px;font:inherit}
#send{background:#7259e8;font-weight:bold}
.info{font-size:12px;color:#9299b0;margin-top:12px;line-height:1.5}
</style>
</head>
<body>
<header>
  <div>
    <h1>✨ Rizik AI</h1>
    <small>Seu assistente pessoal</small>
  </div>
  <button id="clear">Limpar</button>
</header>

<main>
  <div id="status">Rizik está aguardando. Envie uma mensagem ou carregue a IA.</div>

  <div class="toolbar">
    <button id="load" class="primary">Carregar IA</button>
    <button id="search">🌐 Pesquisar</button>
    <button id="weather">🌤️ Clima</button>
    <button id="speak">🔊 Ler resposta</button>
    <button id="stop">Parar voz</button>
  </div>

  <div id="chat"></div>

  <div class="composer">
    <textarea id="prompt" placeholder="Converse com o Rizik..." rows="1"></textarea>
    <button id="send">Enviar</button>
  </div>

  <div class="info">
    Modelo local Qwen 0.5B. O primeiro carregamento baixa aproximadamente 398 MB.
    A pesquisa e o clima precisam de internet. Mantenha a página aberta durante o download.
  </div>
</main>

<script type="module">
import { Wllama } from "https://cdn.jsdelivr.net/npm/@wllama/wllama@3.13.0/esm/index.js";
import WasmFromCDN from "https://cdn.jsdelivr.net/npm/@wllama/wllama@3.13.0/esm/wasm-from-cdn.js";

const $ = id => document.getElementById(id);
const chat = $("chat");
const status = $("status");
const input = $("prompt");

const MODEL_URL =
"https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf";

let ai = null;
let ready = false;
let loadingPromise = null;
let busy = false;
let history = [];
let lastAnswer = "";

function sayStatus(text) {
  status.textContent = text;
}

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "message " + role;
  div.textContent = text;
  chat.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
  return div;
}

function saveHistory() {
  try {
    localStorage.setItem("rizik_history", JSON.stringify(history));
  } catch (err) {
    console.warn("Não foi possível salvar o histórico:", err);
  }
}

function restoreHistory() {
  try {
    const saved = JSON.parse(localStorage.getItem("rizik_history") || "[]");

    history = Array.isArray(saved)
      ? saved.filter(m =>
          m &&
          ["user", "assistant"].includes(m.role) &&
          typeof m.content === "string"
        )
      : [];

    history.slice(-40).forEach(m => addMessage(m.role, m.content));
  } catch (err) {
    history = [];
  }
}

async function loadAI() {
  if (ready) {
    sayStatus("A IA já está carregada!");
    return true;
  }

  if (loadingPromise) {
    return loadingPromise;
  }

  $("load").disabled = true;

  loadingPromise = (async () => {
    try {
      sayStatus("Preparando o motor da IA...");

      ai = new Wllama(WasmFromCDN);

      // Compatibilidade automática, incluindo Safari.
      ai.setCompat("default");

      sayStatus("Conectando ao modelo Qwen...");

      await ai.loadModelFromUrl(MODEL_URL, {
        n_ctx: 2048,
        n_threads: 2,

        progressCallback: ({loaded, total}) => {
          if (total > 0) {
            const percent = Math.round(loaded / total * 100);
            sayStatus("Baixando modelo: " + percent + "%");
          } else {
            sayStatus("Baixando modelo...");
          }
        }
      });

      ready = true;
      sayStatus("Rizik está pronto!");

      addMessage(
        "system",
        "IA carregada com sucesso! 🚀 Agora pode conversar."
      );

      return true;

    } catch (err) {
      console.error("Falha ao carregar Wllama:", err);

      const message = err && err.message
        ? err.message
        : String(err);

      sayStatus("Não foi possível carregar a IA.");

      addMessage(
        "system",
        "Erro ao carregar: " + message +
        ". Verifique a internet e tente novamente."
      );

      ai = null;
      ready = false;

      return false;

    } finally {
      $("load").disabled = false;
      loadingPromise = null;
    }
  })();

  return loadingPromise;
}

async function generate(text, extraContext = "") {
  if (busy) return;

  busy = true;
  $("send").disabled = true;

  let answerBox = null;

  try {
    // Se a IA ainda não estiver carregada, tenta carregar.
    if (!ready) {
      sayStatus("Carregando a IA antes de responder...");

      const loaded = await loadAI();

      if (!loaded) {
        addMessage(
          "system",
          "Não consegui iniciar o modelo. Toque em Carregar IA para tentar novamente."
        );
        return;
      }
    }

    addMessage("user", text);

    const previousMessages = history.slice(-10);

    history.push({
      role: "user",
      content: text
    });

    saveHistory();

    answerBox = addMessage("assistant", "Pensando...");
    sayStatus("Rizik está pensando...");

    const messages = [
      {
        role: "system",
        content:
          "Você é Rizik, um assistente pessoal inteligente e amigável. " +
          "Responda em português brasileiro. Seja claro, natural e útil. " +
          "Use as informações de pesquisa fornecidas quando existirem. " +
          "Não invente fatos nem diga que pesquisou se não pesquisou."
      },

      ...previousMessages,

      {
        role: "user",
        content:
          text +
          (extraContext
            ? "\n\nInformações encontradas na internet:\n" + extraContext
            : "")
      }
    ];

    const result = await ai.createChatCompletion({
      messages: messages,
      max_tokens: 400,
      temperature: 0.7,
      top_p: 0.9
    });

    const answer =
      result &&
      result.choices &&
      result.choices[0] &&
      result.choices[0].message &&
      result.choices[0].message.content
        ? result.choices[0].message.content.trim()
        : "Não consegui gerar uma resposta.";

    answerBox.textContent = answer;
    lastAnswer = answer;

    history.push({
      role: "assistant",
      content: answer
    });

    saveHistory();

  } catch (err) {
    console.error("Erro na conversa:", err);

    const message = err && err.message
      ? err.message
      : String(err);

    if (answerBox) {
      answerBox.textContent = "Erro ao responder: " + message;
    } else {
      addMessage("system", "Erro ao responder: " + message);
    }

  } finally {
    busy = false;
    $("send").disabled = false;

    sayStatus(
      ready
        ? "Rizik está pronto."
        : "Rizik está aguardando."
    );
  }
}

// Botão carregar IA
$("load").addEventListener("click", loadAI);

// Enviar mensagem
$("send").addEventListener("click", async () => {
  const text = input.value.trim();

  if (!text || busy) return;

  input.value = "";

  await generate(text);
});

// Enter envia a mensagem
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    $("send").click();
  }
});

// Limpar conversa
$("clear").addEventListener("click", () => {
  if (!confirm("Apagar a conversa?")) return;

  history = [];
  chat.innerHTML = "";
  lastAnswer = "";

  saveHistory();
});

// Ler resposta em voz alta
$("speak").addEventListener("click", () => {
  if (!lastAnswer) {
    addMessage("system", "Ainda não existe resposta para ler.");
    return;
  }

  if (!("speechSynthesis" in window)) {
    addMessage("system", "Este navegador não oferece leitura de voz.");
    return;
  }

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(lastAnswer);
  utterance.lang = "pt-BR";

  speechSynthesis.speak(utterance);
});

// Parar voz
$("stop").addEventListener("click", () => {
  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }
});

// Pesquisa com limite de tempo
async function fetchTextWithTimeout(url, milliseconds) {
  const controller = new AbortController();

  const timer = setTimeout(
    () => controller.abort(),
    milliseconds
  );

  try {
    const response = await fetch(url, {
      headers: {
        "Accept": "text/plain"
      },
      signal: controller.signal,
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(
        "Serviço respondeu HTTP " + response.status
      );
    }

    return await response.text();

  } finally {
    clearTimeout(timer);
  }
}

// Tenta duas fontes de pesquisa.
async function searchWeb(query) {
  const encoded = encodeURIComponent(query);

  const endpoints = [
    "https://r.jina.ai/http://html.duckduckgo.com/html/?q=" + encoded,
    "https://r.jina.ai/http://www.google.com/search?q=" + encoded
  ];

  let lastError = null;

  for (const url of endpoints) {
    try {
      const result = await fetchTextWithTimeout(url, 25000);

      if (result && result.trim().length > 150) {
        return result.slice(0, 12000);
      }

      throw new Error("A pesquisa retornou pouco conteúdo.");

    } catch (err) {
      lastError = err;
      console.warn("Tentativa de pesquisa falhou:", err);
    }
  }

  throw lastError || new Error("Nenhum serviço de pesquisa respondeu.");
}

// Botão pesquisar
$("search").addEventListener("click", async () => {
  const query = window.prompt("O que você quer pesquisar?");

  if (!query || !query.trim()) return;

  sayStatus("Pesquisando na internet...");
  addMessage("system", "Pesquisando: " + query.trim());

  try {
    const results = await searchWeb(query.trim());

    addMessage(
      "system",
      "Resultados encontrados. O Rizik vai analisar..."
    );

    await generate(
      "Pesquise na internet e explique de forma atualizada: " + query.trim(),
      results
    );

  } catch (err) {
    console.error("Erro na pesquisa:", err);

    sayStatus("Pesquisa indisponível.");

    addMessage(
      "system",
      "Não consegui pesquisar agora: " +
      (err.message || String(err)) +
      ". Tente novamente mais tarde."
    );
  }
});

// Clima
$("weather").addEventListener("click", async () => {
  const city = window.prompt("Qual cidade?", "Nova Esperança");

  if (!city || !city.trim()) return;

  sayStatus("Consultando previsão do tempo...");

  try {
    const geoResponse = await fetch(
      "https://geocoding-api.open-meteo.com/v1/search?name=" +
      encodeURIComponent(city.trim()) +
      "&count=1&language=pt&format=json"
    );

    if (!geoResponse.ok) {
      throw new Error("Erro ao localizar cidade.");
    }

    const geo = await geoResponse.json();

    if (!geo.results || !geo.results.length) {
      throw new Error("Cidade não encontrada.");
    }

    const place = geo.results[0];

    const weatherUrl =
      "https://api.open-meteo.com/v1/forecast?latitude=" +
      place.latitude +
      "&longitude=" +
      place.longitude +
      "&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
      "&timezone=auto&forecast_days=3";

    const weatherResponse = await fetch(weatherUrl);

    if (!weatherResponse.ok) {
      throw new Error("Erro ao consultar previsão.");
    }

    const data = await weatherResponse.json();

    const c = data.current;
    const d = data.daily;

    const report =
      "Clima de " + place.name + ", " +
      (place.admin1 || "") + ", " +
      (place.country || "") + "\n" +

      "Temperatura atual: " + c.temperature_2m + "°C\n" +
      "Sensação térmica: " + c.apparent_temperature + "°C\n" +
      "Umidade: " + c.relative_humidity_2m + "%\n" +
      "Vento: " + c.wind_speed_10m + " km/h\n" +
      "Precipitação atual: " + c.precipitation + " mm\n\n" +

      d.time.map((day, i) =>
        day +
        ": mínima " + d.temperature_2m_min[i] + "°C, " +
        "máxima " + d.temperature_2m_max[i] + "°C, " +
        "chance de chuva " +
        d.precipitation_probability_max[i] + "%"
      ).join("\n");

    addMessage(
      "system",
      "Previsão recebida para " + place.name
    );

    await generate(
      "Explique a previsão do tempo abaixo:",
      report
    );

  } catch (err) {
    console.error("Erro no clima:", err);

    sayStatus("Erro ao consultar o clima.");

    addMessage(
      "system",
      err.message || String(err)
    );
  }
});

// Recuperar histórico
restoreHistory();

// Erros gerais
window.addEventListener("error", event => {
  console.error(
    "Erro JavaScript:",
    event.error || event.message
  );

  sayStatus(
    "Ocorreu um erro no aplicativo. Recarregue a página."
  );
});

window.addEventListener("unhandledrejection", event => {
  console.error("Erro assíncrono:", event.reason);
});
</script>
</body>
</html>
