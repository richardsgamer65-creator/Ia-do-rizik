<script>
(function () {
  try {
    if (self.crossOriginIsolated || !("serviceWorker" in navigator)) return;
    if (sessionStorage.getItem("rizik_coi") === "1") return;
    sessionStorage.setItem("rizik_coi", "1");
    navigator.serviceWorker.register("coi-serviceworker.js").then(function (reg) {
      reg.addEventListener("updatefound", function () { location.reload(); });
      if (reg.active && !navigator.serviceWorker.controller) location.reload();
    }).catch(function (e) { console.warn("Service worker falhou:", e); });
  } catch (e) { console.warn(e); }
})();
</script>
<style>

header{position:sticky;top:0;z-index:15;padding:calc(16px + env(safe-area-inset-top)) 16px 16px;background:rgba(25,27,41,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;justify-content:space-between;align-items:center}

.composer button{border-radius:16px}

.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:min(320px,78vw)}
.gallery.n1{grid-template-columns:1fr}
.gallery.n2,.gallery.n4{grid-template-columns:repeat(2,1fr)}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block}

.viewer{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center}
.viewer[hidden]{display:none}
.viewer img{max-width:96vw;max-height:92vh;border-radius:14px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button[data-ic]{display:inline-flex;align-items:center;justify-content:center;gap:8px}
#menuBtn{width:44px;height:44px;padding:0}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toolbar button{min-height:48px}
.composer{flex-direction:column;align-items:stretch;gap:10px;padding-left:2px;padding-right:2px}
.tools{display:flex;align-items:center;gap:10px}
.row{display:flex;align-items:flex-end;gap:10px}
#attachBtn{width:46px;height:46px;padding:0}
#voiceBtn{height:46px;padding:0 18px;margin-left:auto;background:linear-gradient(135deg,#1fd1ab,#0b8f86);border-color:rgba(255,255,255,.2);box-shadow:0 6px 16px rgba(20,190,160,.4)}
#send{width:52px;height:48px;padding:0;flex:none}
.menu{top:calc(100% + 8px);width:min(360px,calc(100vw - 24px));padding:16px;gap:14px}
.menu label{gap:6px}
.menu select,.menu input[type=text]{width:100%;min-height:42px}
.menu label.check{min-height:36px;gap:10px}
.menu-actions{gap:10px}
.menu-actions button{min-height:46px;padding:10px 8px;font-size:13px}
.menu-actions .i{width:18px;height:18px}
#clear,#install{grid-column:1/-1}
.call{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(40px + env(safe-area-inset-top)) 24px calc(40px + env(safe-area-inset-bottom));background:radial-gradient(80% 60% at 50% 35%,#2a2160,#10111a 72%)}
.call[hidden]{display:none}
.call-top{text-align:center}
.call-top b{display:block;font-size:22px}
.call-top small{color:#aeb4ca;font-size:14px}
.orb{width:200px;height:200px;border-radius:50%;border:0;padding:0;background:radial-gradient(circle at 35% 30%,#c9bcff,#7259e8 55%,#3a22a8);box-shadow:0 0 60px rgba(114,89,232,.6);animation:orbIdle 3s ease-in-out infinite}
.call[data-state=listening] .orb{animation:orbListen 1.6s ease-in-out infinite}
.call[data-state=thinking] .orb{animation:orbThink 1.2s linear infinite;filter:hue-rotate(40deg)}
.call[data-state=speaking] .orb{animation:orbSpeak .55s ease-in-out infinite}
.call[data-state=muted] .orb{filter:grayscale(.8);animation:none;opacity:.7}
@keyframes orbIdle{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes orbListen{0%,100%{transform:scale(1);box-shadow:0 0 40px rgba(114,89,232,.5)}50%{transform:scale(1.08);box-shadow:0 0 90px rgba(114,89,232,.85)}}
@keyframes orbThink{0%{transform:scale(1) rotate(0)}50%{transform:scale(.94) rotate(180deg)}100%{transform:scale(1) rotate(360deg)}}
@keyframes orbSpeak{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.call-text{max-width:520px;text-align:center;color:#c4c9db;font-size:15px;line-height:1.5;min-height:90px;max-height:22vh;overflow:auto}
.call-actions{display:flex;gap:28px}
.round{width:68px;height:68px;border-radius:50%;padding:0}
.round .i{width:28px;height:28px}
.round.end{background:linear-gradient(135deg,#ff6b6b,#d62839)}

.city-list{display:flex;flex-direction:column;gap:6px;max-height:180px;overflow:auto}
.city-list[hidden]{display:none}
.placenow{color:#9299b0;font-size:12px;line-height:1.4}
.cell{position:relative}
.gallery video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block}
.gallery.n1 video{aspect-ratio:4/3}
.badge{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.6);border-radius:8px;padding:2px 7px;font-size:12px}
.viewer video{max-width:96vw;max-height:92vh;border-radius:14px}
</style>
</head>
<body>
<header>
  <div>
    <h1>✨ Rizik AI</h1>
    <small>Seu assistente pessoal · versão 22</small>
  </div>
  <div class="hright">
    <span id="clock"></span>
    <button id="menuBtn" data-ic="dots" aria-label="Configurações"></button>
  </div>
  <div id="menu" class="menu" hidden>
    <div class="menu-title">Configurações</div>
    <label>Modelo
      <select id="setModel">
        <option value="fast">Modelo Rápido</option>
        <option value="code">Código · Leve</option>
        <option value="chat">Modelo Equilibrado</option>
        <option value="chat3">Modelo Inteligente</option>
        <option value="code3">Código · Forte</option>
      </select>
    </label>
    <label>Voz da IA
      <select id="setVoice"></select>
    </label>
    <label>Papel de parede
      <select id="setWall">
        <option value="aurora">Aurora</option>
        <option value="ocean">Oceano</option>
        <option value="sunset">Pôr do sol</option>
        <option value="night">Noite estrelada</option>
      </select>
    </label>
    <label class="check"><input id="setAuto" type="checkbox"> Pesquisar na internet sozinho</label>
    <label class="check"><input id="setAutoload" type="checkbox"> Carregar a IA ao abrir</label>
    <label>Tamanho da resposta
      <select id="setTokens">
        <option value="256">Curta</option>
        <option value="384">Média</option>
        <option value="512">Longa</option>
        <option value="1024">Muito longa (código)</option>
      </select>
    </label>
    <label>Tamanho da leitura
      <select id="setCtx">
        <option value="2048">Normal</option>
        <option value="4096">Grande</option>
        <option value="8192">Máximo (gasta mais memória)</option>
      </select>
    </label>
    <label>Estilo
      <select id="setTemp">
        <option value="0.3">Precisa</option>
        <option value="0.5">Equilibrada</option>
        <option value="0.8">Criativa</option>
      </select>
    </label>
    <label>Região (clima e buscas)
      <input id="setCity" type="text" placeholder="Digite a cidade">
    </label>
    <div class="menu-actions">
      <button id="cityFind" data-ic="search">Buscar cidade</button>
      <button id="gpsBtn" data-ic="pin">Usar GPS</button>
    </div>
    <div id="cityList" class="city-list" hidden></div>
    <small id="placeNow" class="placenow"></small>
    <label class="check"><input id="setGps" type="checkbox"> Usar o GPS sempre que pedir o clima</label>
    <label class="check"><input id="setTime" type="checkbox"> Mostrar horas nas mensagens</label>
    <div class="menu-actions">
      <button id="restart" data-ic="refresh">Reiniciar IA</button>
      <button id="speak" data-ic="volume">Ler resposta</button>
      <button id="histBtn" data-ic="history">Histórico</button>
      <button id="clear" data-ic="trash">Limpar conversa</button>
      <button id="install" data-ic="download">Instalar app</button>
    </div>
  </div>
</header>

<div id="hist" class="hist" hidden>
  <div class="hist-box">
    <div class="hist-head"><span id="histTitle">Histórico</span><button id="histClose">Fechar</button></div>
    <div id="histList" class="hist-list"></div>
  </div>
</div>

<div id="call" class="call" hidden data-state="listening">
  <div class="call-top"><b>Rizik AI</b><small id="callState">Ouvindo...</small></div>
  <button id="orb" class="orb" aria-label="Toque para interromper"></button>
  <div id="callText" class="call-text"></div>
  <div class="call-actions">
    <button id="callMute" class="round" data-ic="mic" aria-label="Silenciar microfone"></button>
    <button id="callEnd" class="round end" data-ic="end" aria-label="Encerrar chamada"></button>
  </div>
</div>

<div id="viewer" class="viewer" hidden><img id="viewerImg" alt=""><video id="viewerVid" controls playsinline hidden></video></div>

<main>
  <div id="status">Rizik está aguardando.</div>
  <div class="toolbar">
    <button id="load" class="primary" data-ic="power">Carregar IA</button>
    <button id="weather" data-ic="weather">Clima</button>
  </div>
  <div id="chat"></div>
  <div class="composer">
    <div id="attachPreview" class="attach-preview" hidden>
      <span id="attachPreviewName"></span>
      <button id="attachRemove">✕ Remover</button>
    </div>
    <div class="tools">
      <div class="attach-wrap">
        <button id="attachBtn" data-ic="plus" title="Anexar" aria-label="Anexar" aria-haspopup="true" aria-expanded="false"></button>
        <div id="attachMenu" class="attach-menu" hidden>
          <button id="attPhoto" data-ic="image">Fotos e vídeos</button>
          <button id="attFile" data-ic="file">Arquivos</button>
          <button id="attWeb" data-ic="globe">Pesquisar na internet</button>
        </div>
      </div>
      <button id="voiceBtn" data-ic="phone" title="Conversar por voz"><span>Conversar</span></button>
      <input id="photoInput" type="file" accept="image/*,video/*" multiple hidden>
      <input id="fileInput" type="file" accept=".txt,.md,.csv,.json,.pdf,text/*,application/pdf,application/json" hidden>
    </div>
    <div class="row">
      <textarea id="prompt" placeholder="Converse com o Rizik..." rows="2"></textarea>
      <button id="send" data-ic="send" aria-label="Enviar"></button>
    </div>
  </div>
  <div class="info">
    Primeiro carregamento da IA pode levar um tempo: use Wi-Fi.
    A pesquisa e o clima precisam de internet.
  </div>
</main>

<script type="module">
import { Wllama } from "https://cdn.jsdelivr.net/npm/@wllama/wllama@3.13.0/esm/index.js";
import WasmFromCDN from "https://cdn.jsdelivr.net/npm/@wllama/wllama@3.13.0/esm/wasm-from-cdn.js";

const $ = id => document.getElementById(id);
const chat = $("chat");
const status = $("status");
const input = $("prompt");

// Três crases montadas por código (não se corrompem ao copiar/colar).
const FENCE = String.fromCharCode(96).repeat(3);

const MODELS = {
  fast: { name: "Modelo Rápido", url: "https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf" },
  code: { name: "Código · Leve", url: "https://huggingface.co/bartowski/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/Qwen2.5-Coder-1.5B-Instruct-Q4_K_M.gguf" },
  chat: { name: "Modelo Equilibrado", url: "https://huggingface.co/bartowski/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf" },
  chat3: { name: "Modelo Inteligente", url: "https://huggingface.co/bartowski/Qwen2.5-3B-Instruct-GGUF/resolve/main/Qwen2.5-3B-Instruct-Q4_K_M.gguf" },
  code3: { name: "Código · Forte", url: "https://huggingface.co/bartowski/Qwen2.5-Coder-3B-Instruct-GGUF/resolve/main/Qwen2.5-Coder-3B-Instruct-Q4_K_M.gguf" }
};

// Se o iPhone travar, reduza N_CTX para 1024.
// Limite de leitura em caracteres: piso de 9000, cresce com o contexto escolhido.
const maxChars = () => Math.max(9000, Math.floor((settings.ctx - settings.tokens - 700) * 2.4));

const settings = Object.assign(

const SYSTEM_CHAT = "Você é Rizik AI, assistente pessoal que fala português brasileiro. Você PODE ajudar com qualquer assunto, inclusive programação. Nunca diga que não pode ajudar. Responda curto e direto. Se o pedido for vago, faça UMA pergunta curta para esclarecer antes de responder. Pense passo a passo antes de dar números ou código. Se não souber, diga \"não sei\". Quando escrever código, coloque sempre dentro de um bloco de código com três crases.";
const SYSTEM_CODE = "Você é Rizik AI, especialista em programação. Responda em português brasileiro. Você PODE ajudar com código. Diga a causa provável do problema, mostre o código corrigido em um bloco de três crases e explique como testar. Se faltar informação, peça o erro exato.";

  { keys: /github|pages|publicar|site.*(não|nao).*atualiz|cache|commit/i,

  { keys: /not defined|undefined|null|cannot read|constant|const|import|syntax|erro|error|bug|console/i,
    text: "Erros comuns de JavaScript: 'X is not defined' = variável não declarada ou fora do escopo; 'Cannot read properties of null' = elemento não existe, confira o id; 'Assignment to constant variable' = troque const por let; erro de import = confira a URL e a versão da biblioteca. Leia sempre a primeira linha vermelha do console." },
  { keys: /lent|trav|demor|memória|memoria|iphone|crash|out of memory/i,

    text: "fetch: use await dentro de try/catch e confira response.ok antes de response.json(). Erro de CORS significa que o servidor não permite a origem: use uma API que libere CORS (origin=*)." },
  { keys: /python|indentation|modulenotfound|pip|nameerror/i,
    text: "Erros comuns de Python: IndentationError = confira os espaços do bloco; ModuleNotFoundError = instale com pip install nome; NameError = variável usada antes de ser definida." },

    text: "Layout no celular: use <meta name=viewport>, flex com flex-wrap, max-width:100% e unidades relativas (rem, %). Teste com a tela estreita." }
];

function pickTips(text) {
  return KNOWLEDGE.filter(i => i.keys.test(text)).slice(0, 2).map(i => i.text).join("\n").slice(0, 400);
}

function looksLikeCode(text) {
  return text.includes(FENCE) || /<\/?[a-z]+[^>]*>|function\s*\(|\bconst\s+\w+\s*=|\blet\s+\w+\s*=|\bdef\s+\w+\(|console\.|Uncaught|Traceback|TypeError|ReferenceError|SyntaxError/i.test(text);
}

const THREADS = self.crossOriginIsolated
  ? Math.max(2, Math.min(4, Math.floor((navigator.hardwareConcurrency || 4) / 2)))
  : 1;

let ai = null, ready = false, loadingPromise = null, busy = false, resetting = false, cancelRequested = false;
let history = [], lastAnswer = "";

// ------------------------------ Interface

function sayStatus(t) { status.textContent = t; }

function fmtTime(t) {
  return new Date(t || Date.now()).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}

function scrollEnd() { window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }); }

async function copyText(text, button, label) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch (err) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
      ok = document.execCommand("copy");
      document.body.removeChild(ta);
    } catch (e) {}
  }
  button.textContent = ok ? "✅ Copiado" : "Não foi possível copiar";
  setTimeout(() => { button.textContent = label; }, 2000);
}

function parseFence(part) {
  const nl = part.indexOf("\n");
  let lang = "", code = part;
  if (nl !== -1) {
    const first = part.slice(0, nl).trim();
    if (first.length <= 15 && /^[\w+#.-]*$/.test(first)) { lang = first; code = part.slice(nl + 1); }
  }
  return { lang, code: code.replace(/\s+$/, "") };
}

function extractCode(text) {
  const parts = String(text).split(FENCE);
  const blocks = [];
  for (let i = 1; i < parts.length; i += 2) {
    const { code } = parseFence(parts[i]);
    if (code) blocks.push(code);
  }
  return blocks.join("\n\n");
}

function checkSyntax(code, lang) {
  const l = String(lang || "").toLowerCase();
  try {
    if (l === "json") { JSON.parse(code); return { ok: true }; }
    if (["js", "javascript", "node"].includes(l)) { new Function(code); return { ok: true }; }
  } catch (e) {
    const msg = String((e && e.message) || e);
    if (/import|export|await|unexpected end/i.test(msg)) return null;
    return { ok: false, msg };
  }
  return null;
}

function makeCodeBlock(code, lang) {
  const box = document.createElement("div");
  box.className = "codeblock";
  const head = document.createElement("div");
  head.className = "code-head";
  const name = document.createElement("span");
  const chk = checkSyntax(code, lang);
  name.textContent = (lang || "código") + (chk ? (chk.ok ? " · ✅ sintaxe ok" : " · ⚠️ " + chk.msg.slice(0, 60)) : "");
  const btn = document.createElement("button");
  btn.textContent = "📋 Copiar código";
  btn.addEventListener("click", () => copyText(code, btn, "📋 Copiar código"));
  head.append(name, btn);
  const pre = document.createElement("pre");
  pre.textContent = code;
  box.append(head, pre);
  return box;
}

function renderRich(container, text) {
  container.textContent = "";
  String(text).split(FENCE).forEach((part, i) => {
    if (i % 2 === 1) {
      const { lang, code } = parseFence(part);
      if (code) container.appendChild(makeCodeBlock(code, lang));
    } else if (part.trim()) {
      const p = document.createElement("div");
      p.className = "txt";
      p.textContent = part.trim();
      container.appendChild(p);
    }
  });
}

function setBody(div, text) {
  const body = div.querySelector(".body");
  if (String(text).includes(FENCE)) renderRich(body, text);
  else body.textContent = text;
}

function addMessage(role, text, t) {
  const div = document.createElement("div");
  div.className = "message " + role;
  const body = document.createElement("div");
  body.className = "body";
  div.appendChild(body);
  if (role === "user" || role === "assistant") {
    const time = document.createElement("small");
    time.className = "msg-time";
    time.textContent = fmtTime(t);
    div.appendChild(time);
  }
  chat.appendChild(div);
  setBody(div, text);
  scrollEnd();
  return div;
}

function createSourcesBox() {
  const box = document.createElement("div");
  box.className = "sources";
  chat.appendChild(box);
  return box;
}

function renderSources(box, sources, title, startedAt, done) {
  box.textContent = "";
  const seconds = ((performance.now() - startedAt) / 1000).toFixed(1);
  const head = document.createElement("div");
  head.className = "src-head";
  head.textContent = done ? "🔎 " + title + " · " + seconds + "s" : "⏳ " + title + "... " + seconds + "s";
  box.appendChild(head);

  sources.forEach(src => {
    const row = document.createElement("div");
    row.className = "src-item";
    const icon = document.createElement("span");
    icon.textContent = src.state === "loading" ? "⏳" : src.state === "ok" ? "✅" : "❌";
    row.appendChild(icon);

    let label;
    if (/^https:\/\//.test(src.url || "")) {
      label = document.createElement("a");
      label.href = src.url; label.target = "_blank"; label.rel = "noopener noreferrer";
    } else label = document.createElement("span");
    label.textContent = src.name;
    row.appendChild(label);

    if (src.state !== "loading") {
      const time = document.createElement("small");
      time.textContent = (src.ms / 1000).toFixed(1) + "s";
      row.appendChild(time);
    }
    box.appendChild(row);
  });
}

function newSource(name, url, sources, onChange) {
  const item = { name, url, state: "loading", ms: 0, started: performance.now() };
  sources.push(item);
  if (onChange) onChange();
  return item;
}

function finishSource(item, ok, onChange, extra) {
  item.state = ok ? "ok" : "fail";
  item.ms = performance.now() - item.started;
  if (extra) { if (extra.name) item.name = extra.name; if (extra.url) item.url = extra.url; }
  if (onChange) onChange();
}

function addActions(text) {
  const row = document.createElement("div");
  row.className = "actions";
  const all = document.createElement("button");
  all.className = "copy";
  all.textContent = "📋 Copiar resposta";
  all.addEventListener("click", () => copyText(text, all, "📋 Copiar resposta"));
  row.appendChild(all);

  const code = extractCode(text);
  if (code) {
    const only = document.createElement("button");
    only.className = "copy";
    only.textContent = "💻 Copiar só o código";
    only.addEventListener("click", () => copyText(code, only, "💻 Copiar só o código"));
    row.appendChild(only);
  }
  chat.appendChild(row);
}

function updateButtons() {
  $("send").disabled = busy;
  $("load").disabled = busy || !!loadingPromise;
  $("restart").disabled = busy || resetting || !!loadingPromise;
  $("weather").disabled = busy;
  $("attachBtn").disabled = busy;
}

// ------------------------------ Histórico

const MAX_QUESTIONS = 34;

function trimQuestions(list) {
  let count = list.filter(m => m.role === "user").length;
  let i = 0;
  while (count > MAX_QUESTIONS && i < list.length) {
    if (list[i].role === "user") count--;
    i++;
  }
  if (i > 0) while (i < list.length && list[i].role === "assistant") i++;
  return list.slice(i);
}

function saveHistory() {
  history = trimQuestions(history);
  try { localStorage.setItem("rizik_history", JSON.stringify(history)); }
  catch (err) { console.warn("Erro ao salvar histórico:", err); }
}

function restoreHistory() {
  try {
    const saved = JSON.parse(localStorage.getItem("rizik_history") || "[]");
    history = Array.isArray(saved)
      ? saved.filter(m => m && ["user", "assistant"].includes(m.role) && typeof m.content === "string")
      : [];
    history = trimQuestions(history);
    history.forEach(m => {
      addMessage(m.role, m.content, m.t);
      if (m.role === "assistant") addActions(m.content);
    });
  } catch (err) { history = []; }
}

function limitText(text, maxChars) {
  text = String(text || "");
  return text.length > maxChars ? text.slice(0, maxChars) + "\n[Conteúdo reduzido.]" : text;
}

function buildMessages(text, extraContext) {
  const isCode = !extraContext && looksLikeCode(text);
  const messages = [{ role: "system", content: (isCode ? SYSTEM_CODE : SYSTEM_CHAT) + (settings.place ? " Localização do usuário: " + placeLabel(settings.place) + "." : "") + (voiceMode ? " Estamos em conversa por voz: responda em no máximo 3 frases curtas, sem listas nem código." : "") }];

  const recent = (isCode && text.length > 1200) ? [] : history.slice(-4);
  for (const item of recent) messages.push({ role: item.role, content: limitText(item.content, 240) });

  const tips = (isCode && text.length <= 1200) ? pickTips(text) : "";
  const research = extraContext ? limitText(extraContext, Math.max(900, Math.floor(maxChars() * 0.6))) : "";

  messages.push({
    role: "user",
    content: limitText(text, maxChars()) +
      (tips ? "\n\nDicas úteis:\n" + tips : "") +
      (research ? "\n\nUse as informações abaixo para responder em português, de forma curta.\nInformações:\n" + research : "")
  });
  return messages;
}

// ------------------------------ Motor

function isEngineCrash(err) {
  const message = String(err && err.message ? err.message : err);
  return /ABORT|wllama has crashed|RuntimeError|memory access out of bounds|unreachable|out of memory/i.test(message);
}

async function destroyAI() {
  const oldAI = ai;
  ai = null;
  ready = false;
  if (oldAI) {
    try { await oldAI.exit(); } catch (err) { console.warn("O motor anterior já estava encerrado:", err); }
  }
}

async function loadAI() {
  if (ready && ai) { sayStatus("A IA já está carregada!"); return true; }
  if (loadingPromise) return loadingPromise;

  $("load").disabled = true;

  loadingPromise = (async () => {
    let newAI = null;
    try {
      sayStatus("Preparando o motor da IA...");
      newAI = new Wllama(WasmFromCDN);
      newAI.setCompat("default");
      ai = newAI;
      ready = false;

      try { localStorage.setItem("rizik_loading", "1"); } catch (e) {}
      sayStatus("Carregando " + MODELS[settings.model].name + "...");

      await newAI.loadModelFromUrl(MODELS[settings.model].url, {
        n_ctx: settings.ctx,
        n_batch: 512,
        n_threads: THREADS,
        n_gpu_layers: 0,
        progressCallback: ({ loaded, total }) => {
          if (total > 0) sayStatus("Baixando modelo: " + Math.round(loaded / total * 100) + "%");
          else sayStatus("Baixando modelo...");
        }
      });

      if (ai !== newAI) { try { await newAI.exit(); } catch (_) {} return false; }

      ready = true;
      try { localStorage.removeItem("rizik_loading"); localStorage.setItem("rizik_autoload", "1"); } catch (e) {}

      sayStatus("Rizik está pronto!");
      addMessage("system",
        "Rizik AI carregado com sucesso! 🚀\nModelo: " + MODELS[settings.model].name +
        "\nNúcleos em uso: " + THREADS + (self.crossOriginIsolated ? " (modo rápido ativo)" : " (modo rápido inativo)"));
      return true;

    } catch (err) {
      console.error("Erro ao carregar Wllama:", err);
      try { localStorage.removeItem("rizik_loading"); } catch (e) {}
      if (newAI) { try { await newAI.exit(); } catch (_) {} }
      if (ai === newAI) ai = null;
      ready = false;
      sayStatus("Falha ao carregar a IA.");
      addMessage("system", "Erro ao carregar: " + (err?.message || String(err)));
      return false;

    } finally {
      loadingPromise = null;
      updateButtons();
    }
  })();

  return loadingPromise;
}

async function restartAI() {
  if (busy || resetting || loadingPromise) return;
  resetting = true;
  updateButtons();
  try {
    sayStatus("Encerrando o motor anterior...");
    await destroyAI();
    sayStatus("Motor encerrado. Preparando nova instância...");
    await new Promise(r => setTimeout(r, 300));
    const success = await loadAI();
    if (success) addMessage("system", "Motor da IA reiniciado com sucesso. 🚀");
    else sayStatus("Não foi possível reiniciar. Tente novamente.");
  } catch (err) {
    console.error("Erro ao reiniciar:", err);
    sayStatus("Falha ao reiniciar o motor.");
  } finally {
    resetting = false;
    updateButtons();
  }
}

// ------------------------------ Gerar resposta

async function generate(text, extraContext = "", opts = {}) {
  if (busy || resetting) return;
  busy = true;
  cancelRequested = false;
  updateButtons();

  const shown = opts.shown || text;
  let answerBox = null, currentEngine = null, thinkTimer = null, thinkStart = 0, cancelBtn = null;

  try {
    if (!opts.skipUser) addMessage("user", shown);
    if (text.length > maxChars()) addMessage("system", "Texto grande: li só os primeiros " + maxChars() + " caracteres.");

    if (!ready || !ai) {
      sayStatus("Carregando a IA...");
      const loaded = await loadAI();
      if (!loaded || !ready || !ai) {
        addMessage("system", "Não consegui iniciar a IA. Abra ⋮ > Reiniciar IA e tente novamente.");
        return;
      }
    }

    currentEngine = ai;
    const messages = buildMessages(text, extraContext);

    if (!opts.noUserHistory) history.push({ role: "user", content: limitText(shown, 9000), t: Date.now() });
    saveHistory();

    answerBox = addMessage("assistant", "");
    answerBox.querySelector(".body").innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';

    const timerBox = document.createElement("div");
    timerBox.className = "message system timerline";
    timerBox.style.alignSelf = "flex-start";
    const timerBody = document.createElement("div");
    timerBody.className = "body";
    timerBody.textContent = "⏱ 0s · lendo a pergunta...";
    cancelBtn = document.createElement("button");
    cancelBtn.className = "gen-cancel";
    cancelBtn.textContent = "✕";
    cancelBtn.title = "Parar a resposta";
    cancelBtn.setAttribute("aria-label", "Parar a resposta");
    cancelBtn.addEventListener("click", () => {
      cancelRequested = true;
      cancelBtn.disabled = true;
      cancelBtn.textContent = "…";
      sayStatus("Parando a resposta...");
    });
    timerBox.append(timerBody, cancelBtn);
    chat.appendChild(timerBox);
    scrollEnd();

    thinkStart = performance.now();
    let tokenCount = 0, firstTokenAt = 0;

    const showTimer = () => {
      const s = (performance.now() - thinkStart) / 1000;
      timerBody.textContent = !firstTokenAt
        ? "⏱ " + Math.round(s) + "s · lendo a pergunta... (toque em ✕ para parar)"
        : "⏱ " + Math.round(s) + "s · escrevendo a resposta · " + tokenCount + " partes";
      sayStatus("Rizik está pensando... " + Math.round(s) + "s");
    };
    showTimer();
    thinkTimer = setInterval(showTimer, 500);

    const stream = await currentEngine.createChatCompletion({
      messages,
      max_tokens: settings.tokens,
      temperature: settings.temp,
      top_p: 0.9,
      stream: true
    });

    let answer = "", truncated = false;

    for await (const chunk of stream) {
      if (ai !== currentEngine || !ready) throw new Error("O motor foi reiniciado durante a geração.");
      if (cancelRequested) break;
      const choice = chunk?.choices?.[0];
      const piece = choice?.delta?.content ?? "";
      if (choice?.finish_reason === "length") truncated = true;
      if (piece) {
        if (!firstTokenAt) firstTokenAt = performance.now();
        tokenCount++;
        answer += piece;
      }
    }

    answer = answer.trim();
    if (!answer) answer = cancelRequested ? "⏹ Resposta interrompida antes de gerar qualquer texto." : "Não consegui gerar uma resposta.";
    else if (cancelRequested) answer += "\n\n⏹ (interrompida por você)";
    clearInterval(thinkTimer);
    thinkTimer = null;
    if (cancelBtn) cancelBtn.remove();

    setBody(answerBox, answer);
    answerBox.querySelector(".msg-time").textContent = fmtTime();
    lastAnswer = answer;

    const totalSeconds = (performance.now() - thinkStart) / 1000;
    const waitSeconds = firstTokenAt ? (firstTokenAt - thinkStart) / 1000 : totalSeconds;

    timerBody.textContent =
      "⏱ Total " + totalSeconds.toFixed(1) + "s · leitura " + waitSeconds.toFixed(1) + "s · " +
      tokenCount + " partes" +
      (cancelRequested ? " · interrompida" : truncated ? " · cortada pelo limite (aumente em ⋮ Configurações)" : "");

    if (extraContext && !opts.noReview) {
      const note = reviewNote(answer, extraContext);
      if (note) {
        const noteBox = addMessage("system", note);
        noteBox.style.alignSelf = "flex-start";
      }
    }

    addActions(answer);
    scrollEnd();

    history.push({ role: "assistant", content: limitText(answer, 9000), t: Date.now() });
    saveHistory();
    return answer;

  } catch (err) {
    console.error("Erro na resposta:", err);
    let text2;

    if (isEngineCrash(err)) {
      sayStatus("O motor travou. Preparando recuperação...");
      await destroyAI();
      text2 = "O motor da IA travou durante a geração.\n\nA instância com erro foi descartada. Abra ⋮ > Reiniciar IA para carregar o modelo novamente.";
    } else {
      text2 = "Erro ao responder: " + (err?.message || String(err));
    }

    if (answerBox) setBody(answerBox, text2);
    else addMessage("system", text2);

  } finally {
    if (thinkTimer) clearInterval(thinkTimer);
    if (cancelBtn && cancelBtn.parentNode) cancelBtn.remove();
    cancelRequested = false;
    busy = false;
    updateButtons();
    sayStatus(ready ? "Rizik está pronto." : "Motor aguardando reinicialização.");
  }
}

// ------------------------------ Clima: detectar pergunta e cidade

const WEATHER_WORDS = /\b(tempo de chuva|clima|chuva|chover|chovendo|previs[aã]o|temperatura|calor|frio)\b/i;

function isWeatherQuestion(text) { return WEATHER_WORDS.test(text); }

function extractCity(text) {
  const clean = String(text).trim();
  let m = clean.match(/^.*\b(?:em|para|na|no)\s+([A-Za-zÀ-ú\s'-]+?)\s*[?!.]*\s*$/i);
  if (!m) m = clean.match(/^.*\b(?:de|da|do)\s+([A-Za-zÀ-ú\s'-]+?)\s*[?!.]*\s*$/i);
  const city = m ? m[1].trim() : "";
  if (!city || WEATHER_WORDS.test(city) || /^(hoje|amanh[ãa]|agora)$/i.test(city)) {
    return "";
  }
  return city;
}

async function handleSend() {
  const text = input.value.trim();
  if (busy || resetting || searching) return;
  if (!text && !pendingAttachment) return;

  if (pendingAttachment) {
    const attachment = pendingAttachment;
    pendingAttachment = null;
    hideAttachPreview();
    input.value = "";
    input.style.height = "";
    await handleLong(attachment.text, attachment.label, text || null);
    return;
  }

  input.value = "";
  input.style.height = "";
  const wasWeb = webMode;
  setWebMode(false);

  if (text.length > 9000 && !wasWeb) { await handleLong(text); return; }

  const quick = wasWeb ? null : quickReply(text);
  if (quick) {
    addMessage("user", text);
    addMessage("assistant", quick);
    addActions(quick);
    history.push(
      { role: "user", content: text, t: Date.now() },
      { role: "assistant", content: quick, t: Date.now() }
    );
    saveHistory();
    lastAnswer = quick;
    return;
  }

  if (isWeatherQuestion(text) && !looksLikeCode(text)) {
    addMessage("user", text);
    await runWeather(extractCity(text));
    return;
  }

  if (wasWeb || (settings.auto && needsWeb(text))) {
    await runSearch(text);
    return;
  }

  if (visionContext && /foto|imagem|imagens|v[ií]deo|figura|cena/i.test(text)) { await generate(text, visionContext, { noReview: true }); return; }

  const answer = await generate(text);

  if (settings.auto && answer && UNSURE.test(answer) && !looksLikeCode(text) && text.length <= 160) {
    addMessage("system", "Não tenho certeza: pesquisando na internet...");
    await runSearch(text, { silent: true });
  }
}

async function fetchTextWithTimeout(url, ms) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  try {
    const response = await fetch(url, { headers: { "Accept": "text/plain" }, signal: controller.signal, cache: "no-store" });
    if (!response.ok) throw new Error("Serviço respondeu HTTP " + response.status);
    return await response.text();
  } finally {
    clearTimeout(timer);
  }
}

const norm = t => String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

const STOP = new Set(("sobre como qual quais quem quando onde porque isso esse essa este esta aquilo mande manda envie " +
  "pesquise pesquisar pesquisa procure busque internet web site google favor pode poderia preciso quero gostaria " +
  "explique explica fale diga mostre uma uns umas para com sem por mais muito pouco meu minha seu sua dos das nos nas pra pro aos").split(" "));

function keywords(text) {
  return norm(text).replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter(w => w.length > 2 && !STOP.has(w));
}

function cleanQuery(text) {
  return String(text).split(/\s+/)
    .map(w => w.replace(/[?!.,;:"()]/g, ""))
    .filter(w => w.length > 2 && !STOP.has(norm(w)))
    .join(" ");
}

const UNSURE = /não sei|não tenho (acesso|informa)|não consigo (acessar|pesquisar|saber)|não encontrei|não posso (ajudar|prever|acessar)|desculpe/i;

function needsWeb(text) {
  if (text.length > 160 || looksLikeCode(text)) return false;
  return /(^|\s)(quem (é|foi|ganhou|venceu)|quando (foi|será|vai)|onde fica|quanto (custa|vale)|qual (é )?(a |o )?(capital|população|cotação|preço|data|resultado|placar)|notícias?|últim[oa]s?|atualmente|20[2-3]\d|presidente|cotação|preço|placar|lançamento|significado de|definição de)(\s|$|\?)/i.test(text);
}

const JOKES = [
  "Por que o livro de matemática ficou triste? Porque tinha muitos problemas.",
  "O que o zero disse para o oito? Belo cinto!",
  "Por que o computador foi ao médico? Estava com vírus.",
  "O que a chuva pediu para o céu? Ser mais azul!",
  "Qual é o café mais perigoso? O ex-presso."
];

function quickReply(text) {
  if (/piada/.test(norm(text)) && text.length < 40) return JOKES[Math.floor(Math.random() * JOKES.length)];

  const t = text.trim().toLowerCase().replace(/[!?.,\s]+$/g, "");
  if (/^(oi+|ol[aá]|opa|e a[ií]|hey|hello)$/.test(t)) return "Olá! Como posso ajudar você hoje?";
  if (t === "bom dia") return "Bom dia! Em que posso ajudar?";
  if (t === "boa tarde") return "Boa tarde! Em que posso ajudar?";
  if (t === "boa noite") return "Boa noite! Em que posso ajudar?";
  if (/^(obrigad[oa]|valeu|brigad[oa])$/.test(t)) return "De nada! 😊";
  if (/^(que horas s[aã]o|que horas|hora certa)$/.test(t)) return "Agora são " + fmtTime() + ".";
  if (/^(que dia [eé] hoje|data de hoje|qual [eé] a data)$/.test(t)) {
    return "Hoje é " + new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long", year: "numeric" }) + ".";
  }

  const expr = t.replace(/^(quanto [eé]|calcule|calcula)\s+/, "").replace(/(\d)\s*x\s*(\d)/g, "$1*$2").replace(/,/g, ".");
  if (expr.length < 60 && /^[\d\s+\-*/().]+$/.test(expr) && /\d\s*[+\-*/]\s*[\d(]/.test(expr)) {
    try {
      const v = Function('"use strict";return (' + expr + ')')();
      if (Number.isFinite(v)) return expr.trim() + " = " + v.toLocaleString("pt-BR", { maximumFractionDigits: 6 });
    } catch (e) {}
  }
  return null;
}

function reviewNote(answer, context) {
  const prose = String(answer).split(FENCE).map((p, i) => i % 2 ? " " : p).join(" ");
  const words = [...new Set(keywords(prose))].filter(w => w.length > 4);
  if (words.length < 6) return "";
  const ctx = keywords(context).join(" ");
  const hits = words.filter(w => ctx.includes(w)).length;
  return hits / words.length < 0.3
    ? "⚠️ Revisão: boa parte da resposta não aparece nas fontes. Confira antes de confiar."
    : "✅ Revisão: a resposta tem apoio nas fontes consultadas.";
}

function cleanWebText(t) {
  return String(t)
    .replace(/!\[[^\]]*\]\([^)]*\)/g, " ")
    .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
    .replace(/https?:\/\/\S+/g, " ")
    .split("\n").map(l => l.trim()).filter(l => l.length > 30).join("\n");
}

async function searchWikipedia(query, words) {
  const url = "https://pt.wikipedia.org/w/api.php?action=query&generator=search" +
    "&gsrsearch=" + encodeURIComponent(query) +
    "&gsrlimit=4&prop=extracts&exintro=1&explaintext=1&exchars=900&format=json&origin=*";

  const response = await fetch(url);
  if (!response.ok) throw new Error("Wikipedia respondeu HTTP " + response.status);

  const data = await response.json();
  const pages = Object.values((data && data.query && data.query.pages) || {});
  if (!pages.length) throw new Error("Sem resultados na Wikipedia.");

  const scored = pages.filter(pg => pg.extract).map(pg => {
    const hay = keywords((pg.title || "") + " " + pg.extract);
    const hits = words.filter(w => hay.includes(w)).length;
    return { pg, score: words.length ? hits / words.length : 0 };
  }).sort((a, b) => b.score - a.score);

  const best = scored[0];
  if (!best || best.score < 0.75) throw new Error("A Wikipedia não tem nada claro sobre isso.");

  const title = best.pg.title;
  return {
    title,
    url: "https://pt.wikipedia.org/wiki/" + encodeURIComponent(title.replace(/ /g, "_")),
    text: "Wikipedia: " + title + "\n" + best.pg.extract
  };
}

async function searchStack(query) {
  const url = "https://api.stackexchange.com/2.3/search/excerpts?order=desc&sort=relevance&pagesize=3&site=stackoverflow&q=" + encodeURIComponent(query);
  const data = JSON.parse(await fetchTextWithTimeout(url, 10000));
  const items = (data && data.items) || [];
  if (!items.length) throw new Error("Sem resultados no Stack Overflow.");
  const plain = html => new DOMParser().parseFromString(html || "", "text/html").documentElement.textContent;
  const text = items.map(i => plain(i.title) + ": " + plain(i.excerpt)).join("\n").slice(0, 900);
  return { text: "Stack Overflow:\n" + text };
}

async function searchDuck(query) {
  const raw = await fetchTextWithTimeout("https://r.jina.ai/http://html.duckduckgo.com/html/?q=" + encodeURIComponent(query), 20000);
  const text = cleanWebText(raw).slice(0, 900);
  if (text.length < 100) throw new Error("Pesquisa sem resultados suficientes.");
  return { text: "Resultados da web:\n" + text };
}

async function searchWeb(query, words, sources, onChange) {
  const tech = /python|javascript|\bjs\b|html|css|java|erro|error|c[oó]digo|programa|\bapi\b|fetch|npm|git|sql|react|node|bug|comando/i.test(query);

  const providers = [];
  if (tech) providers.push({ name: "stackoverflow.com", site: "https://stackoverflow.com", run: () => searchStack(query) });
  providers.push({ name: "pt.wikipedia.org", site: "https://pt.wikipedia.org", run: () => searchWikipedia(query, words) });
  providers.push({ name: "duckduckgo.com (via r.jina.ai)", site: "https://duckduckgo.com", run: () => searchDuck(query) });

  let lastError = null;

  for (const provider of providers) {
    const source = newSource(provider.name, provider.site, sources, onChange);
    try {
      const result = await provider.run();
      finishSource(source, true, onChange, result.title ? { name: provider.name + " → " + result.title, url: result.url } : undefined);
      return result.text;
    } catch (err) {
      finishSource(source, false, onChange);
      lastError = err;
      console.warn("Fonte de pesquisa falhou:", provider.name, err);
    }
  }
  throw lastError || new Error("Pesquisa indisponível.");
}

async function runSearch(rawQuery, opts = {}) {
  const original = rawQuery.trim();

  if (original.length > 160) {
    addMessage("system", "Texto longo demais para pesquisar: respondendo direto.");
    await generate(original);
    return;
  }

  searching = true;
  if (!opts.silent) addMessage("user", original);

  const words = keywords(original);
  const query = (cleanQuery(original) || original) + (settings.place && /perto|aqui|minha cidade|minha regi|próxim|proxim/i.test(original) ? " " + settings.place.name : "");
  const sources = [];
  const searchStart = performance.now();
  const box = createSourcesBox();
  let searchDone = false;

  const refresh = () => renderSources(box, sources, "Pesquisando na internet", searchStart, searchDone);

  const searchTimer = setInterval(() => {
    refresh();
    sayStatus("Pesquisando na internet... " + Math.round((performance.now() - searchStart) / 1000) + "s");
  }, 500);

  refresh();
  scrollEnd();

  try {
    const results = await searchWeb(query, words, sources, refresh);

    clearInterval(searchTimer);
    searchDone = true;
    renderSources(box, sources, "Fontes consultadas", searchStart, true);
    searching = false;

    await generate(original, results, { shown: original, skipUser: true, noUserHistory: !!opts.silent });

    chat.appendChild(box);
    scrollEnd();

  } catch (err) {
    clearInterval(searchTimer);
    searchDone = true;
    renderSources(box, sources, "Fontes consultadas", searchStart, true);
    console.error("Erro na pesquisa:", err);
    sayStatus("Pesquisa indisponível.");
    addMessage("system", "Não achei nada confiável sobre isso: " + (err.message || String(err)));

  } finally {
    searching = false;
  }
}

const WEATHER_TEXT = code => {
  if (code === 0) return "céu limpo";
  if (code <= 3) return "parcialmente nublado";
  if (code === 45 || code === 48) return "neblina";
  if (code >= 51 && code <= 57) return "garoa";
  if (code >= 61 && code <= 67) return "chuva";
  if (code >= 71 && code <= 77) return "neve";
  if (code >= 80 && code <= 82) return "pancadas de chuva";
  if (code >= 95) return "trovoadas";
  return "tempo variável";
};

function shortDate(iso) {
  const parts = String(iso).split("-");
  return parts.length === 3 ? parts[2] + "/" + parts[1] : iso;
}

      "Umidade " + c.relative_humidity_2m + "% · Vento " + c.wind_speed_10m + " km/h · Chuva agora " + c.precipitation + " mm\n\n" +

async function handleLong(text, customLabel, customQuestion) {
  const label = customLabel || (looksLikeCode(text) ? "codigo.txt" : "texto.txt");
  addFileMessage(text, label);
  if (customQuestion) addMessage("user", customQuestion);
  const marker = "📄 " + label + " · " + text.length.toLocaleString("pt-BR") + " caracteres";
  const limit = maxChars();
  const question = customQuestion || "Explique o que este conteúdo faz e aponte erros prováveis, com o trecho corrigido.";

  if (text.length <= limit - 150) {
    await generate(question + "\n\n" + text, "", { shown: marker, skipUser: true });
    return;
  }

  if (!ready || !ai) {
    sayStatus("Carregando a IA...");
    if (!(await loadAI())) { addMessage("system", "Não consegui iniciar a IA. Abra ⋮ > Reiniciar IA."); return; }
  }

  busy = true;
  updateButtons();
  const size = Math.floor(limit * 0.6);
  const parts = [];
  for (let i = 0; i < text.length; i += size) parts.push(text.slice(i, i + size));
  const notes = [];
  const note = addMessage("system", "");
  const engine = ai;

  try {
    for (let i = 0; i < parts.length; i++) {
      note.querySelector(".body").textContent = "📖 Lendo parte " + (i + 1) + " de " + parts.length + "...";
      sayStatus("Lendo parte " + (i + 1) + " de " + parts.length + "...");
      const r = await engine.createChatCompletion({
        messages: [
          { role: "system", content: SYSTEM_CODE },
          { role: "user", content: "Resuma em até 5 linhas o que esta parte faz e liste erros prováveis:\n\n" + parts[i] }
        ],
        max_tokens: 160, temperature: 0.2, stream: false
      });
      notes.push("Parte " + (i + 1) + ": " + String(r?.choices?.[0]?.message?.content || "").trim());
    }
  } catch (err) {
    console.error("Erro na leitura longa:", err);
    if (isEngineCrash(err)) await destroyAI();
    note.querySelector(".body").textContent = "Erro ao ler o texto grande: " + (err?.message || String(err)) + ". Tente ⋮ > Reiniciar IA.";
    busy = false;
    updateButtons();
    sayStatus("Erro na leitura.");
    return;
  }

  busy = false;
  updateButtons();
  note.querySelector(".body").textContent = "✅ Li as " + parts.length + " partes.";
  await generate(question + "\nO conteúdo é grande e foi resumido por partes.", notes.join("\n"), { shown: marker, skipUser: true });
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let voiceMode = false, rec = null, listening = false, speaking = false, voicePending = false, callMuted = false;

const CALL_LABELS = { listening: "Ouvindo...", thinking: "Pensando...", speaking: "Falando... toque na bola para interromper", muted: "Microfone desligado" };
function setCallState(st) {
  $("call").dataset.state = st;
  $("callState").textContent = CALL_LABELS[st] || "";
}
function setCallText(t) { $("callText").textContent = String(t || "").slice(0, 320); }

function ptVoices() {
  return ("speechSynthesis" in window ? speechSynthesis.getVoices() : []).filter(v => /^pt/i.test(v.lang));
}
function pickVoice() {
  const list = ptVoices();
  if (!list.length) return null;
  const saved = list.find(v => v.name === settings.voice);
  if (saved) return saved;
  const rank = v => (/google|natural|neural|online|enhanced|premium/i.test(v.name) ? 2 : 0) + (/BR/i.test(v.lang) ? 1 : 0);
  return list.slice().sort((a, b) => rank(b) - rank(a))[0];
}
function fillVoices() {
  const sel = $("setVoice");
  sel.textContent = "";
  const auto = document.createElement("option");
  auto.value = "";
  auto.textContent = "Automática";
  sel.appendChild(auto);
  ptVoices().forEach(v => {
    const o = document.createElement("option");
    o.value = v.name;
    o.textContent = v.name + " (" + v.lang + ")";
    sel.appendChild(o);
  });
  sel.value = settings.voice || "";
}
if ("speechSynthesis" in window) { speechSynthesis.onvoiceschanged = fillVoices; fillVoices(); }
$("setVoice").addEventListener("change", e => { settings.voice = e.target.value; saveSettings(); });

function startListening() {
  if (!voiceMode || !SR || listening || speaking || busy || callMuted) return;
  rec = new SR();
  rec.lang = "pt-BR";
  rec.interimResults = false;
  rec.continuous = false;
  rec.onstart = () => { listening = true; setCallState("listening"); sayStatus("🎙️ Ouvindo... fale agora."); };
  rec.onresult = e => {
    const t = (e.results[0][0].transcript || "").trim();
    if (t) { setCallText("Você: " + t); setCallState("thinking"); input.value = t; $("send").click(); }
  };
  rec.onerror = e => {
    listening = false;
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      setVoiceMode(false);
      addMessage("system", "Permita o uso do microfone nas configurações do navegador.");
    }
  };
  rec.onend = () => {
    listening = false;
    if (voiceMode && !busy && !speaking && !searching && !voicePending) setTimeout(startListening, 400);
  };
  try { rec.start(); } catch (e) { listening = false; }
}

function setVoiceMode(on) {
  if (on && !SR) {
    addMessage("system", "Este navegador não tem reconhecimento de voz. No iPhone, use o Safari normal (sem o leitor de voz do Chrome); se não funcionar, essa função depende do suporte do navegador.");
    return;
  }
  voiceMode = on;
  $("voiceBtn").classList.toggle("on", on);
  if (on) {
    callMuted = false;
    $("callMute").classList.remove("off");
    $("call").hidden = false;
    setCallState("listening");
    setCallText("Como posso ajudar?");
    chime();
    speakText("Olá! Como posso ajudar?", startListening);
  } else {
    try { if (rec) rec.abort(); } catch (e) {}
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    speaking = false;
    $("call").hidden = true;
    sayStatus(ready ? "Rizik está pronto." : "Rizik está aguardando.");
  }
}

function chime() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    if (ctx.state === "suspended") { ctx.resume().catch(() => {}); }
    [660, 880].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine";
      o.frequency.value = f;
      const t = ctx.currentTime + i * 0.14;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(g);
      g.connect(ctx.destination);
      o.start(t);
      o.stop(t + 0.2);
    });
    setTimeout(() => { try { ctx.close(); } catch (e) {} }, 700);
  } catch (e) {}
}

let speakToken = 0;

function speakText(text, done) {
  if (!("speechSynthesis" in window)) { done(); return; }
  const spoken = String(text).split(FENCE).map((p, i) => i % 2 ? " (código omitido) " : p).join(" ");
  const sentences = spoken.replace(/\s+/g, " ").trim().match(/[^.!?\n]+[.!?]*/g) || [spoken];
  const parts = [];
  let cur = "";
  sentences.forEach(c => {
    if ((cur + c).length > 180 && cur) { parts.push(cur.trim()); cur = c; }
    else cur += c;
  });
  if (cur.trim()) parts.push(cur.trim());

  const token = ++speakToken;
  speaking = true;
  setCallState("speaking");
  setCallText(text);
  speechSynthesis.cancel();

  const finish = () => {
    if (token !== speakToken) return;
    speaking = false;
    if (voiceMode) setCallState(callMuted ? "muted" : "listening");
    done();
  };

  const next = i => {
    if (token !== speakToken) return;
    if (i >= parts.length) { finish(); return; }
    const u = new SpeechSynthesisUtterance(parts[i]);
    u.lang = "pt-BR";
    const pv = pickVoice();
    if (pv) u.voice = pv;
    u.onend = () => next(i + 1);
    u.onerror = e => {
      if (e && (e.error === "interrupted" || e.error === "canceled")) { finish(); return; }
      next(i + 1);
    };
    speechSynthesis.speak(u);
  };

  setTimeout(() => next(0), 120);
}

function voiceDone(before) {
  voicePending = false;
  if (!voiceMode) return;
  if (lastAnswer && lastAnswer !== before) speakText(lastAnswer, startListening);
  else startListening();
}

$("voiceBtn").addEventListener("click", () => setVoiceMode(!voiceMode));
$("callEnd").addEventListener("click", () => setVoiceMode(false));
$("callMute").addEventListener("click", () => {
  callMuted = !callMuted;
  $("callMute").classList.toggle("off", callMuted);
  if (callMuted) { try { if (rec) rec.abort(); } catch (e) {} setCallState("muted"); }
  else { setCallState("listening"); startListening(); }
});
$("orb").addEventListener("click", () => {
  if (speaking) {
    speakToken++;
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    speaking = false;
    setCallState(callMuted ? "muted" : "listening");
    startListening();
    return;
  }
  if (!listening && !busy && !callMuted) startListening();
});

const TEXT_FILE_RE = /\.(txt|md|markdown|csv|json|js|jsx|ts|tsx|py|html|htm|css|xml|yml|yaml|log|java|c|cpp|h|cs|php|rb|go|rs|sql|sh|bat|ini|env)$/i;
const MAX_FILE_BYTES = 400 * 1024;
const MAX_PDF_BYTES = 15 * 1024 * 1024;

let pdfLib = null;
async function loadPdfJs() {
  if (pdfLib) return pdfLib;
  pdfLib = await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.mjs");
  pdfLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.worker.min.mjs";
  return pdfLib;
}

async function extractPdfText(file, setMsg) {
  const lib = await loadPdfJs();
  const buffer = await file.arrayBuffer();
  const doc = await lib.getDocument({ data: buffer }).promise;
  const maxPages = Math.min(doc.numPages, 40);
  let text = "";
  for (let i = 1; i <= maxPages; i++) {
    if (setMsg) setMsg("📄 Lendo página " + i + " de " + maxPages + "...");
    const page = await doc.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it => it.str).join(" ") + "\n\n";
  }
  if (doc.numPages > maxPages) text += "\n[PDF truncado: li " + maxPages + " de " + doc.numPages + " páginas.]";
  return text.trim();
}

$("fileInput").addEventListener("change", async () => {
  const file = $("fileInput").files[0];
  $("fileInput").value = "";
  if (!file || busy || resetting || searching) return;

  const isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
  const looksText = !isPdf && (/^text\//.test(file.type) || file.type === "application/json" || TEXT_FILE_RE.test(file.name) || !file.type);

  if (!isPdf && !looksText) {
    addMessage("system", "Só consigo ler arquivos de texto, código ou PDF (.txt, .md, .csv, .json, .pdf e similares). Para fotos ou vídeos, use a opção \"Fotos e vídeos\".");
    return;
  }
  if (isPdf && file.size > MAX_PDF_BYTES) {
    addMessage("system", "PDF grande demais: o limite é " + Math.round(MAX_PDF_BYTES / 1024 / 1024) + " MB.");
    return;
  }
  if (!isPdf && file.size > MAX_FILE_BYTES) {
    addMessage("system", "Arquivo grande demais: o limite é " + Math.round(MAX_FILE_BYTES / 1024) + " KB de texto.");
    return;
  }

  const loadingBox = isPdf ? addMessage("system", "📄 Abrindo o PDF...") : null;
  let text = "";
  try {
    text = isPdf
      ? await extractPdfText(file, t => { if (loadingBox) loadingBox.querySelector(".body").textContent = t; })
      : await file.text();
  } catch (err) {
    console.error("Erro ao ler arquivo:", err);
    const msg = "Não consegui ler esse arquivo: " + (err?.message || String(err));
    if (loadingBox) loadingBox.querySelector(".body").textContent = msg;
    else addMessage("system", msg);
    return;
  }

  if (loadingBox) loadingBox.remove();

  if (!text.trim()) {
    addMessage("system", isPdf ? "Não encontrei texto nesse PDF (pode ser só imagens digitalizadas)." : "Esse arquivo parece estar vazio.");
    return;
  }

  pendingAttachment = { label: "📄 " + file.name, text };
  showAttachPreview(file.name);
});

async function findCities() {
  const q = $("setCity").value.trim();
  if (!q) return;
  const list = $("cityList");
  list.hidden = false;
  list.textContent = "Buscando...";
  try {
    const r = await fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(q) + "&count=8&language=pt&format=json");
    const j = await r.json();
    list.textContent = "";
    if (!j.results || !j.results.length) { list.textContent = "Cidade não encontrada."; return; }
    j.results.forEach(p => {
      const b = document.createElement("button");
      b.className = "hist-item";
      b.textContent = p.name + (p.admin1 ? " - " + p.admin1 : "") + (p.country ? " · " + p.country : "");
      b.addEventListener("click", () => { savePlace(p); list.hidden = true; });
      list.appendChild(b);
    });
  } catch (e) { list.textContent = "Sem internet para buscar."; }
}

function getPosition() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) { rej(new Error("Este navegador não tem GPS.")); return; }
    navigator.geolocation.getCurrentPosition(res,
      e => rej(new Error(e.code === 1 ? "Permissão de localização negada. Ative nas configurações do navegador." : "Não consegui pegar o GPS.")),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  });
}

async function gpsPlace(sources, refresh) {
  const src = newSource("GPS do aparelho", "", sources, refresh);
  let pos;
  try { pos = await getPosition(); finishSource(src, true, refresh); }
  catch (e) { finishSource(src, false, refresh); throw e; }

  const lat = pos.coords.latitude, lon = pos.coords.longitude;
  let name = "Minha localização", admin1 = "";
  const rs = newSource("api.bigdatacloud.net", "https://www.bigdatacloud.com", sources, refresh);
  try {
    const r = await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=" + lat + "&longitude=" + lon + "&localityLanguage=pt");
    if (r.ok) {
      const j = await r.json();
      name = j.city || j.locality || name;
      admin1 = j.principalSubdivision || "";
      finishSource(rs, true, refresh);
    } else finishSource(rs, false, refresh);
  } catch (e) { finishSource(rs, false, refresh); }
  return { name, admin1, latitude: lat, longitude: lon };
}

async function resolvePlace(city, sources, refresh) {
  if (!city) {
    if (settings.gpsAuto) {
      try { return await gpsPlace(sources, refresh); }
      catch (e) { if (!settings.place && !settings.city) throw e; }
    }
    if (settings.place) return settings.place;
    if (settings.city) city = settings.city;
    else return await gpsPlace(sources, refresh);
  }
  const geoSrc = newSource("geocoding-api.open-meteo.com", "https://open-meteo.com", sources, refresh);
  const resp = await fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(city) + "&count=5&language=pt&format=json");
  finishSource(geoSrc, resp.ok, refresh);
  if (!resp.ok) throw new Error("Erro ao localizar cidade.");
  const geo = await resp.json();
  if (!geo.results || !geo.results.length) throw new Error("Cidade não encontrada.");
  return geo.results.find(r => r.country_code === "BR") || geo.results[0];
}

let tfLib = null, visionBusy = false, visionContext = "";

async function loadTF() {
  if (tfLib) return tfLib;
  const urls = [
    "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.6",
    "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1",
    "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.3.3"
  ];
  for (const u of urls) {
    try { tfLib = await import(u); break; } catch (e) { console.warn("Falha ao importar", u, e); }
  }
  if (!tfLib) throw new Error("Não consegui carregar o leitor de imagens. Confira a internet.");
  tfLib.env.allowLocalModels = false;
  return tfLib;
}

async function mkPipe(T, task, model, label, setMsg) {
  const cb = p => { if (p && p.status === "progress" && typeof p.progress === "number") setMsg("Baixando " + label + ": " + Math.round(p.progress) + "%"); };
  try { return await T.pipeline(task, model, { dtype: "q8", progress_callback: cb }); }
  catch (e) { console.warn("q8 falhou, tentando o padrão", e); return await T.pipeline(task, model, { progress_callback: cb }); }
}

async function imageToDataURL(file, max = 512) {
  const bmp = await createImageBitmap(file);
  const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(bmp.width * sc));
  c.height = Math.max(1, Math.round(bmp.height * sc));
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  if (bmp.close) bmp.close();
  return c.toDataURL("image/jpeg", 0.85);
}

async function videoFrames(file, n) {
  const url = URL.createObjectURL(file);
  const v = document.createElement("video");
  v.muted = true;
  v.playsInline = true;
  v.preload = "auto";
  v.src = url;
  await new Promise((res, rej) => { v.onloadedmetadata = res; v.onerror = () => rej(new Error("vídeo ilegível")); });
  const dur = isFinite(v.duration) ? v.duration : 0;
  const sc = Math.min(1, 384 / Math.max(v.videoWidth || 384, v.videoHeight || 384));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round((v.videoWidth || 384) * sc));
  c.height = Math.max(1, Math.round((v.videoHeight || 384) * sc));
  const frames = [];
  for (let i = 0; i < n; i++) {
    const t = Math.max(0.05, dur ? dur * (i + 0.5) / n : 0.05);
    await new Promise(res => { const to = setTimeout(res, 4000); v.onseeked = () => { clearTimeout(to); res(); }; v.currentTime = t; });
    c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
    frames.push(c.toDataURL("image/jpeg", 0.85));
  }
  URL.revokeObjectURL(url);
  return { frames, dur };
}

async function analyzeMedia(files, setMsg) {
  const T = await loadTF();
  setMsg("Carregando o leitor de imagens (a 1ª vez baixa uns 300 MB)...");
  const cap = await mkPipe(T, "image-to-text", "Xenova/vit-gpt2-image-captioning", "descrição de imagens", setMsg);
  let det = null;
  if (files.some(f => f.type.startsWith("image/"))) {
    try { det = await mkPipe(T, "object-detection", "Xenova/detr-resnet-50", "detector de objetos", setMsg); }
    catch (e) { console.warn("Sem detector de objetos:", e); }
  }

  const lines = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    const isVid = f.type.startsWith("video/");
    const tag = (isVid ? "Vídeo " : "Foto ") + (i + 1);
    setMsg("🔍 Analisando " + tag + " (" + (i + 1) + "/" + files.length + ")...");
    try {
      if (isVid) {
        const { frames, dur } = await videoFrames(f, 5);
        const caps = [];
        for (const fr of frames) {
          const o = await cap(fr, { max_new_tokens: 30 });
          caps.push(String(o[0].generated_text || "").trim());
        }
        lines.push(tag + " (" + Math.round(dur) + "s), cenas em ordem: " + caps.map((c, k) => (k + 1) + ") " + c).join("; "));
      } else {
        const url = await imageToDataURL(f);
        const o = await cap(url, { max_new_tokens: 30 });
        let objs = "";
        if (det) {
          const d = await det(url, { threshold: 0.75 });
          const count = {};
          d.forEach(x => { count[x.label] = (count[x.label] || 0) + 1; });
          objs = Object.entries(count).map(([k, v]) => k + " x" + v).join(", ");
        }
        lines.push(tag + ": legenda (em inglês): " + String(o[0].generated_text || "").trim() + (objs ? ". Objetos: " + objs : ""));
      }
    } catch (err) {
      console.error(err);
      lines.push(tag + ": não consegui ler este arquivo.");
    }
  }
  for (const m of [cap, det]) { try { if (m && m.dispose) await m.dispose(); } catch (e) {} }
  return lines.join("\n");
}

async function runVision(files, btn) {
  if (busy || resetting || searching || visionBusy) return;
  visionBusy = true;
  btn.disabled = true;
  const box = addMessage("system", "🔍 Preparando o leitor de imagens...");
  const setMsg = t => { box.querySelector(".body").textContent = t; sayStatus(t); };
  let ctxText = "";
  try {
    ctxText = await analyzeMedia(files, setMsg);
    setMsg("✅ Análise pronta: " + files.length + (files.length === 1 ? " arquivo." : " arquivos."));
    visionContext = ctxText;
  } catch (err) {
    console.error("Erro na visão:", err);
    setMsg("Não consegui analisar: " + (err.message || String(err)));
  }
  visionBusy = false;
  btn.disabled = false;
  if (ctxText) {
    await generate(
      "Descreva em português, de forma curta, o que aparece em cada foto ou vídeo. Traduza as legendas em inglês. Use somente as análises.",
      ctxText,
      { shown: "🔍 Identificar " + files.length + (files.length === 1 ? " arquivo" : " arquivos"), noReview: true }
    );
  }
}
