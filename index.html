<script>
(function () {
  // Ativa o modo rápido (vários núcleos) no GitHub Pages.
  try {
    if (self.crossOriginIsolated || !("serviceWorker" in navigator)) return;
    if (sessionStorage.getItem("rizik_coi") === "1") return;
    sessionStorage.setItem("rizik_coi", "1");
    navigator.serviceWorker.register("coi-serviceworker.js").then(function (reg) {
      reg.addEventListener("updatefound", function () { location.reload(); });
      if (reg.active && !navigator.serviceWorker.controller) location.reload();
    }).catch(function (e) { console.warn("Service worker falhou:", e); });
  } catch (e) { console.warn(e); }
})();
</script>

<style>

<body>
<header>
  <div>
    <h1>✨ Rizik AI</h1>
    <small>Seu assistente pessoal · versão 10</small>
  </div>
  <button id="clear">Limpar</button>
</header>

<main>
  <div id="status">Rizik está aguardando.</div>

  <div class="toolbar">
    <button id="load" class="primary">Carregar IA</button>
    <button id="restart">🔄 Reiniciar IA</button>
    <button id="search">🌐 Pesquisar</button>
    <button id="weather">🌤️ Clima</button>
    <button id="speak">🔊 Ler resposta</button>
    <button id="stop">Parar voz</button>
  </div>

  <div id="chat"></div>

  <div class="composer">
    <textarea id="prompt" placeholder="Converse com o Rizik..." rows="2"></textarea>
    <button id="send">Enviar</button>
  </div>

  <div class="info">
    Modelo local Qwen 0.5B. Primeiro carregamento: aproximadamente 398 MB. Use Wi-Fi.
    A pesquisa e o clima precisam de internet.
    Configuração otimizada para reduzir o consumo de memória no iPhone.
  </div>
</main>

<script type="module">
import { Wllama } from "https://cdn.jsdelivr.net/npm/@wllama/wllama@3.13.0/esm/index.js";
import WasmFromCDN from "https://cdn.jsdelivr.net/npm/@wllama/wllama@3.13.0/esm/wasm-from-cdn.js";

const $ = id => document.getElementById(id);

const chat = $("chat");
const status = $("status");
const input = $("prompt");

const MODEL_URL =
"https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf";

const SYSTEM_CHAT = `Você é Rizik AI, assistente pessoal. Responda em português brasileiro, de forma curta e direta. Não invente fatos.`;

const SYSTEM_CODE = `Você é Rizik AI, especialista em programação. Responda em português brasileiro.
Ao receber código com problema: 1) diga a causa provável; 2) explique a correção; 3) entregue o código atualizado e completo dentro de um bloco de código (três crases), sem remover funções; 4) diga como testar. Use as dicas úteis quando existirem.
Não invente bibliotecas nem resultados de testes. Se faltar informação, peça o erro exato.`;

// Notas internas de programação. O Rizik recebe só as 2 mais parecidas
// com o pedido (o modelo é pequeno e o contexto é curto).
const KNOWLEDGE = [
  {
    keys: /criar.*ia|fazer.*ia|minha ia|assistente|wllama|modelo local|gguf/i,
    text: "Criar uma IA no navegador: 1) importe o Wllama pelo cdn.jsdelivr.net; 2) carregue um modelo GGUF pequeno (Qwen2.5 0.5B Q4_K_M, cerca de 398 MB) com loadModelFromUrl; 3) gere a resposta com createChatCompletion e stream:true; 4) publique o index.html no GitHub Pages. Vários núcleos exigem o arquivo coi-serviceworker.js."
  },
  {
    keys: /github|pages|publicar|site.*(não|nao).*atualiz|cache|commit/i,
    text: "Publicar no GitHub Pages: coloque o index.html na raiz do repositório, faça o commit, espere 1 a 2 minutos e abra o link com ?v=2 no final (troque o número a cada versão) para fugir do cache do Safari."
  },
  {
    keys: /not defined|undefined|null|cannot read|constant|const|import|syntax|erro|error|bug|console/i,
    text: "Erros comuns de JavaScript: 'X is not defined' = variável não declarada ou fora do escopo; 'Cannot read properties of null' = elemento não existe, confira o id; 'Assignment to constant variable' = troque const por let; erro de import = confira a URL e a versão da biblioteca. Leia sempre a primeira linha vermelha do console."
  },
  {
    keys: /lent|trav|demor|memória|memoria|iphone|crash|out of memory/i,
    text: "IA lenta ou travando no iPhone: use modelo pequeno (0.5B), n_ctx entre 512 e 1024, prompt curto, max_tokens baixo e vários núcleos com o coi-serviceworker.js. Prompt longo deixa a leitura lenta."
  },
  {
    keys: /fetch|api|cors|json|requisição|requisicao/i,
    text: "fetch: use await dentro de try/catch e confira response.ok antes de response.json(). Erro de CORS significa que o servidor não permite a origem: use uma API que libere CORS (origin=*)."
  },
  {
    keys: /python|indentation|modulenotfound|pip|nameerror/i,
    text: "Erros comuns de Python: IndentationError = confira os espaços do bloco; ModuleNotFoundError = instale com pip install nome; NameError = variável usada antes de ser definida."
  },
  {
    keys: /html|css|layout|celular|responsiv|botão|botao/i,
    text: "Layout no celular: use <meta name=viewport>, flex com flex-wrap, max-width:100% e unidades relativas (rem, %). Teste com a tela estreita."
  }
];

function pickTips(text) {
  const picked = KNOWLEDGE
    .filter(item => item.keys.test(text))
    .slice(0, 2)
    .map(item => item.text);

  return picked.join("\n").slice(0, 650);
}

function looksLikeCode(text) {
  return /```|<\/?[a-z]+[^>]*>|function\s|const\s|let\s|def\s|class\s|import\s|erro|error|exception|código|codigo|bug|corrij|corrigi|programa|script|html|css|python|java/i.test(text);
}

// Vários núcleos só funcionam com isolamento de origem cruzada
// (ativado pelo arquivo coi-serviceworker.js).
const THREADS = self.crossOriginIsolated
  ? Math.max(2, Math.min(4, navigator.hardwareConcurrency || 2))
  : 1;

let ai = null;
let ready = false;
let loadingPromise = null;
let busy = false;
let resetting = false;
let history = [];
let lastAnswer = "";

// ------------------------------
// Interface
// ------------------------------

function sayStatus(text) {
  status.textContent = text;
}

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "message " + role;
  div.textContent = text;
  chat.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
  return div;
}

function createSourcesBox() {
  const box = document.createElement("div");
  box.className = "sources";
  chat.appendChild(box);
  return box;
}

function renderSources(box, sources, title, startedAt, done) {
  box.textContent = "";

  const seconds = ((performance.now() - startedAt) / 1000).toFixed(1);

  const head = document.createElement("div");
  head.className = "src-head";
  head.textContent = done
    ? "🔎 " + title + " · " + seconds + "s"
    : "⏳ " + title + "... " + seconds + "s";
  box.appendChild(head);

  sources.forEach(src => {
    const row = document.createElement("div");
    row.className = "src-item";

    const icon = document.createElement("span");
    icon.textContent =
      src.state === "loading" ? "⏳" : src.state === "ok" ? "✅" : "❌";
    row.appendChild(icon);

    let label;

    if (/^https:\/\//.test(src.url || "")) {
      label = document.createElement("a");
      label.href = src.url;
      label.target = "_blank";
      label.rel = "noopener noreferrer";
    } else {
      label = document.createElement("span");
    }

    label.textContent = src.name;
    row.appendChild(label);

    if (src.state !== "loading") {
      const time = document.createElement("small");
      time.textContent = (src.ms / 1000).toFixed(1) + "s";
      row.appendChild(time);
    }

    box.appendChild(row);
  });
}

function newSource(name, url, sources, onChange) {
  const item = {
    name,
    url,
    state: "loading",
    ms: 0,
    started: performance.now()
  };

  sources.push(item);
  if (onChange) onChange();
  return item;
}

function finishSource(item, ok, onChange, extra) {
  item.state = ok ? "ok" : "fail";
  item.ms = performance.now() - item.started;

  if (extra) {
    if (extra.name) item.name = extra.name;
    if (extra.url) item.url = extra.url;
  }

  if (onChange) onChange();
}

function addCopyButton(text) {
  const button = document.createElement("button");
  button.className = "copy";
  button.textContent = "📋 Copiar resposta";

  button.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(text);
      button.textContent = "✅ Copiado";
    } catch (err) {
      button.textContent = "Não foi possível copiar";
    }

    setTimeout(() => {
      button.textContent = "📋 Copiar resposta";
    }, 2000);
  });

  chat.appendChild(button);
}

function updateButtons() {
  $("send").disabled = busy;
  $("load").disabled = busy || !!loadingPromise;
  $("restart").disabled = busy || resetting || !!loadingPromise;
  $("search").disabled = busy;
  $("weather").disabled = busy;
}

// ------------------------------
// Histórico compacto
// ------------------------------

function saveHistory() {
  try {
    localStorage.setItem(
      "rizik_history",
      JSON.stringify(history.slice(-20))
    );
  } catch (err) {
    console.warn("Erro ao salvar histórico:", err);
  }
}

function restoreHistory() {
  try {
    const saved = JSON.parse(
      localStorage.getItem("rizik_history") || "[]"
    );

    history = Array.isArray(saved)
      ? saved.filter(m =>
          m &&
          ["user", "assistant"].includes(m.role) &&
          typeof m.content === "string"
        ).slice(-20)
      : [];

    history.forEach(m => addMessage(m.role, m.content));

  } catch (err) {
    history = [];
  }
}

function limitText(text, maxChars) {
  text = String(text || "");
  return text.length > maxChars
    ? text.slice(0, maxChars) + "\n[Conteúdo reduzido.]"
    : text;
}

function buildMessages(text, extraContext) {
  const messages = [
    {
      role: "system",
      content: (extraContext || !looksLikeCode(text))
        ? SYSTEM_CHAT
        : SYSTEM_CODE
    }
  ];

  // Apenas as duas mensagens mais recentes.
  const recent = history.slice(-2);

  for (const item of recent) {
    messages.push({
      role: item.role,
      content: limitText(item.content, 150)
    });
  }

  const safeText = limitText(text, 700);
  const tips = (!extraContext && looksLikeCode(text)) ? pickTips(text) : "";
  const safeResearch = extraContext
    ? limitText(extraContext, 450)
    : "";

  messages.push({
    role: "user",
    content:
      safeText +
      (tips ? "\n\nDicas úteis:\n" + tips : "") +
      (safeResearch
        ? "\n\nUse somente as informações abaixo. Se não tiverem relação com a pergunta, diga que não encontrou.\nInformações:\n" + safeResearch
        : "")
  });

  return messages;
}

// ------------------------------
// Identificação de falhas
// ------------------------------

function isEngineCrash(err) {
  const message = String(
    err && err.message ? err.message : err
  );

  return /ABORT|wllama has crashed|RuntimeError|memory access out of bounds|unreachable|out of memory/i.test(message);
}

// ------------------------------
// Encerrar motor anterior
// ------------------------------

async function destroyAI() {
  const oldAI = ai;

  // Impede que outra parte do código reutilize a instância.
  ai = null;
  ready = false;

  if (oldAI) {
    try {
      await oldAI.exit();
    } catch (err) {
      console.warn("O motor anterior já estava encerrado:", err);
    }
  }
}

// ------------------------------
// Carregar modelo
// ------------------------------

async function loadAI() {
  if (ready && ai) {
    sayStatus("A IA já está carregada!");
    return true;
  }

  if (loadingPromise) {
    return loadingPromise;
  }

  $("load").disabled = true;

  loadingPromise = (async () => {
    let newAI = null;

    try {
      sayStatus("Preparando o motor da IA...");

      newAI = new Wllama(WasmFromCDN);
      newAI.setCompat("default");

      ai = newAI;
      ready = false;

      sayStatus("Carregando modelo Qwen...");

      await newAI.loadModelFromUrl(MODEL_URL, {
        // Configuração mais leve para iPhone.
        n_ctx: 1024,
        n_batch: 256,
        n_threads: THREADS,
        n_gpu_layers: 0,

        progressCallback: ({loaded, total}) => {
          if (total > 0) {
            const percent = Math.round(loaded / total * 100);
            sayStatus("Baixando modelo: " + percent + "%");
          } else {
            sayStatus("Baixando modelo...");
          }
        }
      });

      // Confere se a instância continua sendo a atual.
      if (ai !== newAI) {
        try { await newAI.exit(); } catch (_) {}
        return false;
      }

      ready = true;

      sayStatus("Rizik está pronto!");
      addMessage(
        "system",
        "Rizik AI carregado com sucesso! 🚀\nNúcleos em uso: " + THREADS +
        (self.crossOriginIsolated
          ? " (modo rápido ativo)"
          : " (modo rápido inativo)")
      );

      return true;

    } catch (err) {
      console.error("Erro ao carregar Wllama:", err);

      if (newAI) {
        try { await newAI.exit(); } catch (_) {}
      }

      if (ai === newAI) {
        ai = null;
      }

      ready = false;

      const message = err?.message || String(err);

      sayStatus("Falha ao carregar a IA.");
      addMessage("system", "Erro ao carregar: " + message);

      return false;

    } finally {
      loadingPromise = null;
      updateButtons();
    }
  })();

  return loadingPromise;
}

// ------------------------------
// Reiniciar motor sem atualizar página
// ------------------------------

async function restartAI() {
  if (busy || resetting || loadingPromise) {
    return;
  }

  resetting = true;
  updateButtons();

  try {
    sayStatus("Encerrando o motor anterior...");

    await destroyAI();

    sayStatus("Motor encerrado. Preparando nova instância...");

    await new Promise(resolve => setTimeout(resolve, 300));

    const success = await loadAI();

    if (success) {
      addMessage("system", "Motor da IA reiniciado com sucesso. 🚀");
    } else {
      sayStatus("Não foi possível reiniciar. Tente novamente.");
    }

  } catch (err) {
    console.error("Erro ao reiniciar:", err);
    sayStatus("Falha ao reiniciar o motor.");
  } finally {
    resetting = false;
    updateButtons();
  }
}

// ------------------------------
// Gerar resposta
// ------------------------------

async function generate(text, extraContext = "") {
  if (busy || resetting) return;

  busy = true;
  updateButtons();

  let answerBox = null;
  let currentEngine = null;
  let thinkTimer = null;
  let thinkStart = 0;

  try {
    if (!ready || !ai) {
      sayStatus("Carregando a IA...");

      const loaded = await loadAI();

      if (!loaded || !ready || !ai) {
        addMessage(
          "system",
          "Não consegui iniciar a IA. Use Reiniciar IA e tente novamente."
        );
        return;
      }
    }

    currentEngine = ai;

    addMessage("user", text);

    const messages = buildMessages(text, extraContext);

    history.push({
      role: "user",
      content: limitText(text, 400)
    });

    saveHistory();

    answerBox = addMessage("assistant", "Pensando...");

    // Contador de tempo logo abaixo da resposta.
    const timerBox = addMessage("system", "⏱ 0s · lendo a pergunta...");
    timerBox.style.alignSelf = "flex-start";

    thinkStart = performance.now();
    let tokenCount = 0;
    let firstTokenAt = 0;

    const showTimer = () => {
      const seconds = (performance.now() - thinkStart) / 1000;

      if (!firstTokenAt) {
        timerBox.textContent =
          "⏱ " + Math.round(seconds) + "s · lendo a pergunta...";
      } else {
        const genSeconds = (performance.now() - firstTokenAt) / 1000;
        const speed = genSeconds > 0 ? tokenCount / genSeconds : 0;
        timerBox.textContent =
          "⏱ " + Math.round(seconds) + "s · digitando · " +
          tokenCount + " partes · " + speed.toFixed(1) + "/s";
      }

      sayStatus("Rizik está pensando... " + Math.round(seconds) + "s");
    };

    showTimer();
    thinkTimer = setInterval(showTimer, 500);

    const stream = await currentEngine.createChatCompletion({
      messages,
      max_tokens: 256,
      temperature: 0.6,
      top_p: 0.9,
      stream: true
    });

    let answer = "";

    for await (const chunk of stream) {
      if (ai !== currentEngine || !ready) {
        throw new Error("O motor foi reiniciado durante a geração.");
      }

      const piece = chunk?.choices?.[0]?.delta?.content ?? "";

      if (piece) {
        if (!firstTokenAt) firstTokenAt = performance.now();
        tokenCount++;
        answer += piece;
        answerBox.textContent = answer;
        window.scrollTo(0, document.body.scrollHeight);
      }
    }

    answer = answer.trim() || "Não consegui gerar uma resposta.";

    clearInterval(thinkTimer);
    thinkTimer = null;

    answerBox.textContent = answer;
    lastAnswer = answer;

    const totalSeconds = (performance.now() - thinkStart) / 1000;
    const waitSeconds = firstTokenAt
      ? (firstTokenAt - thinkStart) / 1000
      : totalSeconds;

    timerBox.textContent =
      "⏱ Total " + totalSeconds.toFixed(1) + "s · " +
      "leitura " + waitSeconds.toFixed(1) + "s · " +
      tokenCount + " partes";

    addCopyButton(answer);

    history.push({
      role: "assistant",
      content: limitText(answer, 700)
    });

    saveHistory();

  } catch (err) {
    console.error("Erro na resposta:", err);

    const message = err?.message || String(err);

    if (isEngineCrash(err)) {
      sayStatus("O motor travou. Preparando recuperação...");

      // Descarta a instância que apresentou falha.
      await destroyAI();

      if (answerBox) {
        answerBox.textContent =
          "O motor da IA travou durante a geração.\n\n" +
          "A instância com erro foi descartada. Toque em Reiniciar IA para carregar o modelo novamente.";
      } else {
        addMessage(
          "system",
          "O motor travou e foi descartado. Toque em Reiniciar IA."
        );
      }

    } else {
      if (answerBox) {
        answerBox.textContent = "Erro ao responder: " + message;
      } else {
        addMessage("system", "Erro ao responder: " + message);
      }
    }

  } finally {
    if (thinkTimer) clearInterval(thinkTimer);

    busy = false;
    updateButtons();

    sayStatus(
      ready
        ? "Rizik está pronto."
        : "Motor aguardando reinicialização."
    );
  }
}

// ------------------------------
// Eventos principais
// ------------------------------

$("load").addEventListener("click", loadAI);

$("restart").addEventListener("click", restartAI);

$("send").addEventListener("click", async () => {
  const text = input.value.trim();

  if (!text || busy || resetting) return;

  input.value = "";
  await generate(text);
});

input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    $("send").click();
  }
});

$("clear").addEventListener("click", () => {
  if (!confirm("Apagar toda a conversa?")) return;

  history = [];
  chat.innerHTML = "";
  lastAnswer = "";
  saveHistory();
});

// ------------------------------
// Voz
// ------------------------------

$("speak").addEventListener("click", () => {
  if (!lastAnswer) {
    addMessage("system", "Ainda não existe resposta para ler.");
    return;
  }

  if (!("speechSynthesis" in window)) {
    addMessage("system", "Leitura de voz indisponível.");
    return;
  }

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(lastAnswer);
  utterance.lang = "pt-BR";
  speechSynthesis.speak(utterance);
});

$("stop").addEventListener("click", () => {
  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }
});

// ------------------------------
// Pesquisa na internet
// ------------------------------

async function fetchTextWithTimeout(url, milliseconds) {
  const controller = new AbortController();

  const timer = setTimeout(
    () => controller.abort(),
    milliseconds
  );

  try {
    const response = await fetch(url, {
      headers: {"Accept": "text/plain"},
      signal: controller.signal,
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Serviço respondeu HTTP " + response.status);
    }

    return await response.text();

  } finally {
    clearTimeout(timer);
  }
}

async function searchWikipedia(query) {
  const url =
    "https://pt.wikipedia.org/w/api.php?action=query&generator=search" +
    "&gsrsearch=" + encodeURIComponent(query) +
    "&gsrlimit=1&prop=extracts&exintro=1&explaintext=1&exchars=500" +
    "&format=json&origin=*";

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error("Wikipedia respondeu HTTP " + response.status);
  }

  const data = await response.json();
  const pages = data && data.query && data.query.pages;

  if (!pages) {
    throw new Error("Sem resultados na Wikipedia.");
  }

  const page = Object.values(pages)[0];

  if (!page || !page.extract) {
    throw new Error("Sem resultados na Wikipedia.");
  }

  return "Wikipedia: " + page.title + "\n" + page.extract;
}

async function searchWeb(query, sources, onChange) {
  const wiki = newSource(
    "pt.wikipedia.org",
    "https://pt.wikipedia.org",
    sources,
    onChange
  );

  try {
    const wikiText = await searchWikipedia(query);
    const title = wikiText.split("\n")[0].replace("Wikipedia: ", "");

    finishSource(wiki, true, onChange, {
      name: "pt.wikipedia.org → " + title,
      url: "https://pt.wikipedia.org/wiki/" +
        encodeURIComponent(title.replace(/ /g, "_"))
    });

    return wikiText;

  } catch (err) {
    finishSource(wiki, false, onChange);
    console.warn("Wikipedia falhou, tentando outra fonte:", err);
  }

  const encoded = encodeURIComponent(query);

  const endpoints = [
    {
      name: "duckduckgo.com (via r.jina.ai)",
      site: "https://duckduckgo.com",
      url: "https://r.jina.ai/http://html.duckduckgo.com/html/?q=" + encoded
    },
    {
      name: "google.com (via r.jina.ai)",
      site: "https://www.google.com",
      url: "https://r.jina.ai/http://www.google.com/search?q=" + encoded
    }
  ];

  let lastError = null;

  for (const endpoint of endpoints) {
    const source = newSource(endpoint.name, endpoint.site, sources, onChange);

    try {
      const result = await fetchTextWithTimeout(endpoint.url, 20000);

      if (result && result.trim().length > 100) {
        finishSource(source, true, onChange);
        return result.slice(0, 600);
      }

      throw new Error("Pesquisa sem resultados suficientes.");

    } catch (err) {
      finishSource(source, false, onChange);
      lastError = err;
      console.warn("Fonte de pesquisa falhou:", err);
    }
  }

  throw lastError || new Error("Pesquisa indisponível.");
}

$("search").addEventListener("click", async () => {
  if (busy || resetting) return;

  let query = window.prompt("O que você quer pesquisar?");

  if (!query || !query.trim()) return;

  // Perguntas sobre tempo/chuva usam a previsão de verdade.
  if (/tempo|clima|chuva|previs|temperatura|calor|frio|chover/i.test(query)) {
    const match = query.trim().match(
      /(?:em|para|de|da|do)\s+([A-Za-zÀ-ú\s]+?)\s*\??\s*$/i
    );
    const city = match ? match[1].trim() : "Nova Esperança";

    addMessage("system", "Pergunta sobre o tempo: consultando a previsão de " + city);
    await runWeather(city || "Nova Esperança");
    return;
  }

  // Pedidos de ajuda ou de código não são pesquisa: vão direto para o chat.
  if (/^\s*(me\s+)?(ajud|corrij|corrig|cri[ea]|faça|faz)|programa|código|codigo|erro\b|bug\b/i.test(query)) {
    addMessage("system", "Isso é um pedido de ajuda: respondendo direto, sem pesquisar.");
    await generate(query.trim());
    return;
  }

  // Tira as palavras de pedido para a Wikipedia achar o assunto certo.
  query = query
    .replace(/^\s*(pesquis[ea]r?|me\s+explique|me\s+fale|explique|fale)\s+(sobre\s+)?/i, "")
    .replace(/^\s*(o\s+que\s+(é|são)|quem\s+(é|foi)|o\s+que\s+significa)\s+/i, "")
    .replace(/\?+\s*$/, "")
    .trim() || query;

  addMessage("system", "Pesquisando: " + query);

  const sources = [];
  const searchStart = performance.now();
  const box = createSourcesBox();
  let searchDone = false;

  const refresh = () =>
    renderSources(box, sources, "Pesquisando na internet", searchStart, searchDone);

  const searchTimer = setInterval(() => {
    refresh();
    sayStatus(
      "Pesquisando na internet... " +
      Math.round((performance.now() - searchStart) / 1000) + "s"
    );
  }, 500);

  refresh();

  try {
    const results = await searchWeb(query.trim(), sources, refresh);

    clearInterval(searchTimer);
    searchDone = true;
    renderSources(box, sources, "Fontes consultadas", searchStart, true);

    await generate(
      "Pesquise e explique: " + query.trim(),
      results
    );

    // As fontes ficam logo abaixo da resposta.
    chat.appendChild(box);
    window.scrollTo(0, document.body.scrollHeight);

  } catch (err) {
    clearInterval(searchTimer);
    searchDone = true;
    renderSources(box, sources, "Fontes consultadas", searchStart, true);

    console.error("Erro na pesquisa:", err);
    sayStatus("Pesquisa indisponível.");

    addMessage(
      "system",
      "Não consegui pesquisar agora: " + (err.message || String(err))
    );
  }
});

const WEATHER_TEXT = code => {
  if (code === 0) return "céu limpo";
  if (code <= 3) return "parcialmente nublado";
  if (code === 45 || code === 48) return "neblina";
  if (code >= 51 && code <= 57) return "garoa";
  if (code >= 61 && code <= 67) return "chuva";
  if (code >= 71 && code <= 77) return "neve";
  if (code >= 80 && code <= 82) return "pancadas de chuva";
  if (code >= 95) return "trovoadas";
  return "tempo variável";
};

function shortDate(iso) {
  const parts = String(iso).split("-");
  return parts.length === 3 ? parts[2] + "/" + parts[1] : iso;
}

async function runWeather(city) {
  const started = performance.now();
  const sources = [];
  const box = createSourcesBox();
  const refresh = () =>
    renderSources(box, sources, "Consultando a previsão", started, false);

  refresh();
  sayStatus("Consultando previsão do tempo...");

  try {
    const geoSrc = newSource(
      "geocoding-api.open-meteo.com",
      "https://open-meteo.com",
      sources,
      refresh
    );

    const geoResponse = await fetch(
      "https://geocoding-api.open-meteo.com/v1/search?name=" +
      encodeURIComponent(city) +
      "&count=5&language=pt&format=json"
    );

    finishSource(geoSrc, geoResponse.ok, refresh);

    if (!geoResponse.ok) {
      throw new Error("Erro ao localizar cidade.");
    }

    const geo = await geoResponse.json();

    if (!geo.results || !geo.results.length) {
      throw new Error("Cidade não encontrada.");
    }

    const place =
      geo.results.find(r => r.country_code === "BR") || geo.results[0];

    const weatherSrc = newSource(
      "api.open-meteo.com",
      "https://open-meteo.com",
      sources,
      refresh
    );

    const weatherUrl =
      "https://api.open-meteo.com/v1/forecast?latitude=" +
      place.latitude +
      "&longitude=" +
      place.longitude +
      "&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
      "&timezone=auto&forecast_days=3";

    const weatherResponse = await fetch(weatherUrl);

    finishSource(weatherSrc, weatherResponse.ok, refresh);

    if (!weatherResponse.ok) {
      throw new Error("Erro ao consultar previsão.");
    }

    const data = await weatherResponse.json();
    const c = data.current;
    const d = data.daily;

    const days = d.time.map((day, i) =>
      (i === 0 ? "Hoje" : shortDate(day)) +
      ": " + WEATHER_TEXT(d.weather_code[i]) +
      ", mín " + d.temperature_2m_min[i] + "°C, máx " +
      d.temperature_2m_max[i] + "°C, chuva " +
      d.precipitation_probability_max[i] + "%"
    ).join("\n");

    const report =
      "🌤️ Clima em " + place.name +
      (place.admin1 ? " - " + place.admin1 : "") + "\n\n" +
      "Agora: " + c.temperature_2m + "°C (sensação " +
      c.apparent_temperature + "°C), " + WEATHER_TEXT(c.weather_code) + "\n" +
      "Umidade " + c.relative_humidity_2m + "% · Vento " +
      c.wind_speed_10m + " km/h · Chuva agora " + c.precipitation + " mm\n\n" +
      days;

    addMessage("assistant", report);
    lastAnswer = report;

    renderSources(box, sources, "Fontes da previsão", started, true);
    chat.appendChild(box);

    sayStatus(ready ? "Rizik está pronto." : "Rizik está aguardando.");

  } catch (err) {
    console.error("Erro no clima:", err);
    renderSources(box, sources, "Fontes da previsão", started, true);
    sayStatus("Erro ao consultar o clima.");
    addMessage("system", err.message || String(err));
  }
}

$("weather").addEventListener("click", async () => {
  if (busy || resetting) return;

  const city = window.prompt("Qual cidade?", "Nova Esperança");

  if (!city || !city.trim()) return;

  await runWeather(city.trim());
});
